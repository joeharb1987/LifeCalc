<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeCalc">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./lifecalc-icon.svg">
<link rel="apple-touch-icon" href="./lifecalc-icon-180.png">
<title>LifeCalc</title>
<style>
  :root{
    --bg:#F5F1E7;
    --panel:#1B2340;
    --key:#FFFFFF;
    --key-border:#E4DFD1;
    --amber:#C9954B;
    --text:#1B2340;
    --text-dim:#928E80;
    --text-on-navy:#F5F1E7;
    --top-btn:#FFFFFF;
    --fn-bg:#FFFFFF;
    --op-bg:#1B2340;
    --op-text:#C9954B;
    --eq-bg:#C9954B;
    --eq-text:#FFFFFF;
    --shadow:rgba(27,35,64,.06);
  }

  body.dark{
    --bg:#000000;
    --panel:#000000;
    --key:#333333;
    --key-border:#4A4A4A;
    --amber:#FF9500;
    --text:#FFFFFF;
    --text-dim:#A5A5A5;
    --text-on-navy:#FFFFFF;
    --top-btn:#1C1C1E;
    --fn-bg:#A5A5A5;
    --op-bg:#FF9500;
    --op-text:#FFFFFF;
    --eq-bg:#FF9500;
    --eq-text:#FFFFFF;
    --shadow:transparent;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
  }

  button,input,select{ font:inherit; }

  .app{
    width:100%;
    max-width:480px;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      16px
      calc(env(safe-area-inset-bottom) + 8px);
    background:var(--bg);
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }

  .mode-toggle{
    display:flex;
    flex:1;
    min-width:0;
    background:var(--top-btn);
    border:1px solid var(--key-border);
    border-radius:999px;
    padding:4px;
  }

  .mode-toggle button{
    flex:1;
    min-width:0;
    border:0;
    background:transparent;
    color:var(--text-dim);
    border-radius:999px;
    padding:9px 6px;
    font-size:13px;
    font-weight:700;
  }

  .mode-toggle button.active{
    background:var(--panel);
    color:var(--text-on-navy);
  }

  body.dark .mode-toggle button.active{
    background:#FFFFFF;
    color:#000000;
  }

  .icon-btn,.history-btn,.theme-btn{
    width:44px;
    height:44px;
    flex:0 0 44px;
    border-radius:50%;
    border:1px solid var(--key-border);
    background:var(--top-btn);
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
  }

  .theme-btn{ font-size:18px; }

  .display{
    position:relative;
    flex:1 1 auto;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:12px 6px 10px;
    background:transparent;
    border-radius:0;
    margin:0;
    overflow:hidden;
  }

  .expr{
    min-height:28px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    color:var(--text-dim);
    text-align:right;
    font-size:21px;
    font-weight:400;
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
    letter-spacing:-.02em;
  }
  .expr::-webkit-scrollbar{display:none;}

  .result{
    margin-top:4px;
    min-height:76px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    color:var(--text);
    text-align:right;
    font-size:66px;
    font-weight:300;
    line-height:1;
    letter-spacing:-.045em;
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
    user-select:text;
    -webkit-user-select:text;
  }
  body.dark .result{ color:#fff; }
  .result::-webkit-scrollbar{display:none;}
  .result.small{font-size:48px;}
  .result.tiny{font-size:35px;}

  .history-panel{
    position:absolute;
    inset:6px 0 8px;
    display:none;
    flex-direction:column;
    padding:18px 18px;
    border-radius:28px;
    background:var(--panel);
    color:var(--text-on-navy);
    z-index:10;
  }
  .history-panel.open{display:flex;}
  .history-panel h3{
    margin:0 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    color:#9AA1C4;
  }
  .history-panel .clear{color:#E0937E;}
  .history-list{
    overflow:auto;
    display:flex;
    flex-direction:column-reverse;
    gap:4px;
  }
  .history-item{
    padding:10px 0;
    border-bottom:1px solid rgba(154,161,196,.18);
    text-align:right;
  }
  .history-item .h-expr{font-size:16px;color:#9AA1C4;}
  .history-item .h-res{font-size:28px;color:var(--text-on-navy);}
  .history-empty{margin-top:50px;text-align:center;color:#9AA1C4;}

  .toast{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%) translateY(8px);
    background:rgba(0,0,0,.78);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:.18s ease;
    z-index:30;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .paste-overlay{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 60px);
    left:16px;
    right:16px;
    z-index:25;
    display:none;
  }
  .paste-overlay.open{display:block;}
  .paste-overlay input{
    width:100%;
    height:48px;
    border:1px solid var(--key-border);
    background:var(--top-btn);
    color:var(--text);
    border-radius:14px;
    padding:0 14px;
    font-size:17px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);
  }

  .pad{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }

  .pad.basic{
    grid-template-rows:repeat(5,minmax(66px,1fr));
    height:min(50vh,500px);
    margin-top:auto;
  }

  button.key{
    border:1px solid var(--key-border);
    border-radius:26px;
    background:var(--key);
    color:var(--text);
    font-size:34px;
    font-weight:400;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    box-shadow:0 1px 0 var(--shadow);
    transition:transform .04s ease,filter .06s ease;
  }

  button.key:active{
    transform:scale(.95);
    filter:brightness(.94);
  }

  .k-fn{
    background:var(--fn-bg)!important;
    color:var(--text)!important;
    font-size:28px!important;
  }

  body.dark .k-fn{
    color:#000!important;
    border-color:#A5A5A5!important;
  }

  .k-op{
    background:var(--op-bg)!important;
    color:var(--op-text)!important;
    border-color:var(--op-bg)!important;
    font-size:36px!important;
    font-weight:400!important;
  }

  .k-eq{
    background:var(--eq-bg)!important;
    color:var(--eq-text)!important;
    border-color:var(--eq-bg)!important;
    font-size:36px!important;
  }

  .k-wide{
    grid-column:span 2;
    justify-content:flex-start!important;
    padding-left:30px!important;
  }

  .pad.sci{
    grid-template-rows:repeat(7,minmax(46px,1fr));
    height:min(58vh,550px);
    gap:8px;
  }

  .pad.sci button.key{
    border-radius:20px;
    font-size:24px;
  }
  .pad.sci .k-sci{font-size:15px;}

  .convert-panel{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-top:14px;
  }

  .cat-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .cat-row::-webkit-scrollbar{display:none;}

  .cat-chip{
    flex:0 0 auto;
    border:1px solid var(--key-border);
    background:var(--top-btn);
    color:var(--text-dim);
    border-radius:999px;
    padding:9px 15px;
    font-weight:700;
  }
  .cat-chip.active{
    background:var(--panel);
    color:var(--text-on-navy);
  }
  body.dark .cat-chip.active{
    background:#fff;
    color:#000;
  }

  .conv-card{
    background:var(--top-btn);
    border:1px solid var(--key-border);
    border-radius:22px;
    padding:15px 17px;
  }
  .conv-card label{
    display:block;
    margin-bottom:5px;
    color:var(--text-dim);
    font-size:12px;
    font-weight:700;
  }
  .conv-card select{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    font-size:16px;
    font-weight:700;
  }
  .conv-value{
    width:100%;
    margin-top:10px;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-size:36px;
    font-weight:400;
  }
  .swap-row{display:flex;justify-content:center;margin:-2px 0;}
  .swap-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:var(--amber);
    color:white;
    font-size:20px;
  }
  .conv-result{
    margin-top:auto;
    background:var(--panel);
    border-radius:26px;
    padding:18px;
  }
  body.dark .conv-result{background:#1C1C1E;}
  .conv-result .r-unit{color:#9AA1C4;font-size:13px;font-weight:700;}
  .conv-result .r-value{
    margin-top:3px;
    color:var(--text-on-navy);
    font-size:42px;
    font-weight:400;
    word-break:break-all;
  }

  @media (max-height:740px){
    .app{
      padding-top:calc(env(safe-area-inset-top) + 6px);
      padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
    }
    .icon-btn,.history-btn,.theme-btn{width:40px;height:40px;flex-basis:40px;}
    .mode-toggle button{padding:7px 5px;}
    .display{min-height:165px;padding-bottom:8px;}
    .expr{font-size:21px;}
    .result{font-size:56px;min-height:60px;}
    .result.small{font-size:45px;}
    .result.tiny{font-size:35px;}
    .pad.basic{height:min(51vh,440px);gap:8px;}
    button.key{border-radius:24px;font-size:29px;}
    .k-fn{font-size:24px!important;}
    .k-op,.k-eq{font-size:32px!important;}
  }

  @media (min-width:430px) and (min-height:820px){
    .display{min-height:245px;}
    .pad.basic{height:500px;}
    button.key{border-radius:28px;}
    .result{font-size:74px;}
  }

  @media (min-height:900px){
    .display{min-height:290px;}
    .pad.basic{height:500px;}
  }


  button.key.operator-active{
    background:var(--text-on-navy)!important;
    color:var(--panel)!important;
  }
  body.dark button.key.operator-active{
    background:#FFFFFF!important;
    color:#FF9500!important;
  }


.key sup{font-size:.55em;line-height:0;position:relative;top:-.55em;margin-left:1px;vertical-align:baseline;}
/* V6.2 performance polish */
button.key:active{
  transform:scale(.96);
}
.result,.expr{
  contain:layout paint;
}

/* Fit everything above the bottom bar on any screen: the display gives up space first,
   then the keys shrink (never below a comfortable tap size). */
.display{flex:1 1 auto;min-height:104px;}
.pad.basic{grid-template-rows:repeat(5,minmax(46px,1fr));height:min(50dvh,500px);}
.pad.sci{grid-template-rows:repeat(7,minmax(36px,1fr));height:min(56dvh,550px);}
@media (max-height:620px){
  .pad.basic{height:46dvh;gap:7px;}
  .pad.sci{height:54dvh;gap:6px;}
  .result{font-size:46px;min-height:50px;}
  .result.small{font-size:38px;}
  .result.tiny{font-size:30px;}
  .expr{font-size:18px;min-height:22px;}
  .pad.sci button.key{font-size:20px;border-radius:16px;}
}

/* Shared LifeCalc bottom bar (same items as the Budget pages) */
.app{
  padding-bottom:calc(env(safe-area-inset-bottom) + 72px);
}
.lc-tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--top-btn);
  border-top:1px solid var(--key-border);
  padding-bottom:env(safe-area-inset-bottom);
}
.lc-tabbar-inner{
  max-width:480px;margin:0 auto;height:64px;
  display:grid;grid-template-columns:repeat(5,1fr);
}
.lc-tabbar a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--text-dim);text-decoration:none;font-size:11px;font-weight:600;
}
.lc-tabbar a.on{color:var(--amber);}
.lc-tabbar svg{width:23px;height:23px;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="history-btn" id="historyBtn" aria-label="History">&#8635;</button>
    <div class="mode-toggle">
      <button id="modeBasic" class="active">Basic</button>
      <button id="modeSci">Scientific</button>
      <button id="modeConvert">Convert</button>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">&#9788;</button>
  </div>

  <div class="paste-overlay" id="pasteOverlay">
    <input type="text" id="pasteInput" inputmode="decimal" autocomplete="off" placeholder="Tap and hold to paste a number">
  </div>

  <div class="display" id="displayPanel">
    <div class="expr" id="exprEl">&nbsp;</div>
    <div class="result" id="resultEl">0</div>
    <div class="toast" id="toastEl">Copied</div>

    <div class="history-panel" id="historyPanel">
      <h3>History <span class="clear" id="clearHistory">Clear</span></h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <div class="pad basic" id="padBasic">
    <button class="key k-fn" data-act="clear">AC</button>
    <button class="key k-fn" data-act="sign">&plusmn;</button>
    <button class="key k-fn" data-act="percent">%</button>
    <button class="key k-op" data-act="op" data-val="&divide;">&divide;</button>

    <button class="key" data-act="digit" data-val="7">7</button>
    <button class="key" data-act="digit" data-val="8">8</button>
    <button class="key" data-act="digit" data-val="9">9</button>
    <button class="key k-op" data-act="op" data-val="&times;">&times;</button>

    <button class="key" data-act="digit" data-val="4">4</button>
    <button class="key" data-act="digit" data-val="5">5</button>
    <button class="key" data-act="digit" data-val="6">6</button>
    <button class="key k-op" data-act="op" data-val="&minus;">&minus;</button>

    <button class="key" data-act="digit" data-val="1">1</button>
    <button class="key" data-act="digit" data-val="2">2</button>
    <button class="key" data-act="digit" data-val="3">3</button>
    <button class="key k-op" data-act="op" data-val="+">+</button>

    <button class="key k-wide" data-act="digit" data-val="0">0</button>
    <button class="key" data-act="decimal">.</button>
    <button class="key k-eq" data-act="equals">=</button>
  </div>

  <div class="pad sci" id="padSci" style="display:none;">
    <button class="key k-sci" data-act="fn" data-val="sin">sin</button>
    <button class="key k-sci" data-act="fn" data-val="cos">cos</button>
    <button class="key k-sci" data-act="fn" data-val="tan">tan</button>
    <button class="key k-fn" data-act="clear">AC</button>

    <button class="key k-sci" data-act="fn" data-val="ln">ln</button>
    <button class="key k-sci" data-act="fn" data-val="log">log</button>
    <button class="key k-sci" data-act="fn" data-val="sqrt">&radic;</button>
    <button class="key k-fn" data-act="back">&#9003;</button>

    <button class="key k-sci" data-act="const" data-val="pi">&pi;</button>
    <button class="key k-sci" data-act="const" data-val="e">e</button>
    <button class="key k-op" data-act="op" data-val="^" aria-label="Power">x<sup>y</sup></button>
    <button class="key k-op" data-act="op" data-val="&divide;">&divide;</button>

    <button class="key" data-act="digit" data-val="7">7</button>
    <button class="key" data-act="digit" data-val="8">8</button>
    <button class="key" data-act="digit" data-val="9">9</button>
    <button class="key k-op" data-act="op" data-val="&times;">&times;</button>

    <button class="key" data-act="digit" data-val="4">4</button>
    <button class="key" data-act="digit" data-val="5">5</button>
    <button class="key" data-act="digit" data-val="6">6</button>
    <button class="key k-op" data-act="op" data-val="&minus;">&minus;</button>

    <button class="key" data-act="digit" data-val="1">1</button>
    <button class="key" data-act="digit" data-val="2">2</button>
    <button class="key" data-act="digit" data-val="3">3</button>
    <button class="key k-op" data-act="op" data-val="+">+</button>

    <button class="key" data-act="paren" data-val="(" aria-label="Brackets">( )</button>
    <button class="key" data-act="digit" data-val="0">0</button>
    <button class="key" data-act="decimal">.</button>
    <button class="key k-eq" data-act="equals">=</button>
  </div>

  <div class="convert-panel" id="padConvert" style="display:none;">
    <div class="cat-row" id="catRow"></div>

    <div class="conv-card">
      <label>From</label>
      <select id="fromSelect"></select>
      <input type="text" class="conv-value" id="convValueInput" inputmode="decimal" value="1">
    </div>

    <div class="swap-row">
      <button class="swap-btn" id="swapBtn" aria-label="Swap units">&#8645;</button>
    </div>

    <div class="conv-card">
      <label>To</label>
      <select id="toSelect"></select>
    </div>

    <div class="conv-result" id="convResult">
      <div class="r-unit" id="convResultUnit">&nbsp;</div>
      <div class="r-value" id="convResultValue">0</div>
    </div>
  </div>
</div>

<script>
(function(){
  var exprEl = document.getElementById('exprEl');
  var resultEl = document.getElementById('resultEl');
  var historyPanel = document.getElementById('historyPanel');
  var historyList = document.getElementById('historyList');
  var historyBtn = document.getElementById('historyBtn');
  var clearHistoryBtn = document.getElementById('clearHistory');
  var padBasic = document.getElementById('padBasic');
  var padSci = document.getElementById('padSci');
  var padConvert = document.getElementById('padConvert');
  var displayPanel = document.getElementById('displayPanel');
  var modeBasic = document.getElementById('modeBasic');
  var modeSci = document.getElementById('modeSci');
  var modeConvert = document.getElementById('modeConvert');
  var toastEl = document.getElementById('toastEl');
  var pasteBtn = document.getElementById('pasteBtn');
  var pasteOverlay = document.getElementById('pasteOverlay');
  var pasteInput = document.getElementById('pasteInput');

  var display = '';          // expression being built, e.g. "12×(3+4)" — uses − × ÷ and sqrt( etc.
  var completedExpr = '';    // expression shown above the result after =
  var justEvaluated = false; // display holds a result
  var entryCleared = false;  // C was just used, so the key now reads AC
  var history = [];
  var currentMode = 'basic';
  var repeatOp = null;
  var repeatOperand = null;
  var carry = null;          // { text, value }: the full-precision number behind a displayed result

  var OPERATORS = '÷×−+^';
  function isOperator(c){ return !!c && c.length === 1 && OPERATORS.indexOf(c) >= 0; }
  var MINUS = '−';
  var FN_RE = /(sin|cos|tan|ln|log|sqrt)\($/;

  function loadHistory(){
    try{
      var s = localStorage.getItem('calc_history_v4');
      if (!s) s = localStorage.getItem('calc_history_v1');
      history = s ? JSON.parse(s) : [];
    }catch(e){ history = []; }
    renderHistory();
  }

  function saveHistory(){
    try{ localStorage.setItem('calc_history_v4', JSON.stringify(history.slice(-30))); }catch(e){}
  }

  // ---------- Numbers ----------
  // Result → display text. Uses − for negatives and E for scientific notation
  // (lower-case e is the constant), integers up to 15 digits shown in full.
  function fmtNum(n){
    if (!isFinite(n)) return 'Error';
    if (Math.abs(n) < 1e-14) n = 0;
    var abs = Math.abs(n), s;
    if (abs >= 1e15 || (abs > 0 && abs < 1e-9)) {
      s = n.toExponential(9).replace(/\.?0+e/, 'e');
    } else {
      var whole = Number(n.toPrecision(15));
      var v = Number.isInteger(whole) ? whole : Number(n.toPrecision(12));
      s = String(v);
      if (/e/.test(s)) s = v.toExponential().replace(/\.?0+e/, 'e');
    }
    return s.replace('e+', 'E+').replace('e-', 'E−').replace(/^-/, MINUS);
  }

  function parseDisplayNum(s){
    return parseFloat(String(s).replace(/,/g, '').replace(/−/g, '-').replace('E', 'e'));
  }

  // Thousands separators on integer parts, √ for sqrt — display only.
  function prettify(expr){
    return String(expr)
      .replace(/sqrt\(/g, '√(')
      .replace(/(\d+)(\.\d*)?/g, function(m, int, frac, offset, whole){
        if (whole.charAt(offset - 1) === 'E' || whole.charAt(offset - 2) === 'E') return m;  // exponent digits
        return int.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (frac || '');
      });
  }

  // ---------- Expression parser (no eval) ----------
  // Precedence: unary minus < ^ (right-assoc), so −2^2 = −4 and 2^3^2 = 512.
  // Implicit multiplication: 2π, 2(3), (2)(3), 2√9. Missing ) are closed at the end.
  function tokenize(s){
    var t = [], i = 0, m;
    while (i < s.length) {
      var c = s.charAt(i), rest = s.slice(i);
      // A carried-over result keeps its full precision (the display shows it rounded).
      if (carry && (i === 0 || s.charAt(i - 1) === '(') && rest.indexOf(carry.text) === 0 && !/^[0-9.E]/.test(rest.slice(carry.text.length))) {
        t.push({ k:'num', v: carry.value }); i += carry.text.length; continue;
      }
      if ((m = rest.match(/^(\d+\.?\d*|\.\d+)(E[+−-]?\d+)?/))) {
        t.push({ k:'num', v: parseDisplayNum(m[0]) }); i += m[0].length; continue;
      }
      if (c === '.') throw new Error('bad number');
      if (c === 'π') { t.push({ k:'num', v: Math.PI }); i++; continue; }
      if (c === 'e') { t.push({ k:'num', v: Math.E }); i++; continue; }
      if ((m = rest.match(/^(sin|cos|tan|ln|log|sqrt)(?=\()/))) { t.push({ k:'fn', v: m[1] }); i += m[1].length; continue; }
      if (c === '+' ) { t.push({ k:'op', v:'+' }); i++; continue; }
      if (c === MINUS || c === '-') {
        // A minus where a value is expected, directly before a number, is part of that number
        // (−2^2 = 4 and 2^−2 = 0.25, as on a phone calculator).
        var prev = t[t.length - 1], unary = !prev || prev.k === 'op' || prev.k === '(';
        if (unary && (m = s.slice(i + 1).match(/^(\d+\.?\d*|\.\d+)(E[+\u2212-]?\d+)?/))) {
          t.push({ k:'num', v: -parseDisplayNum(m[0]) }); i += 1 + m[0].length; continue;
        }
        t.push({ k:'op', v:'-' }); i++; continue;
      }
      if (c === '×' || c === '*') { t.push({ k:'op', v:'*' }); i++; continue; }
      if (c === '÷' || c === '/') { t.push({ k:'op', v:'/' }); i++; continue; }
      if (c === '^') { t.push({ k:'op', v:'^' }); i++; continue; }
      if (c === '(' || c === ')') { t.push({ k:c }); i++; continue; }
      if (c === ' ' || c === ',') { i++; continue; }
      throw new Error('bad token ' + c);
    }
    return t;
  }

  var FNS = { sin: Math.sin, cos: Math.cos, tan: Math.tan, ln: Math.log, log: Math.log10, sqrt: Math.sqrt };

  function evaluate(expr){
    if (!expr) return null;
    try{
      var t = tokenize(expr), p = 0;
      var peek = function(){ return t[p]; };
      var isOp = function(v){ var x = t[p]; return x && x.k === 'op' && x.v === v; };
      var parseExpr = function(){
        var v = parseTerm();
        while (isOp('+') || isOp('-')) { var o = t[p++].v, r = parseTerm(); v = o === '+' ? v + r : v - r; }
        return v;
      };
      var startsValue = function(x){ return x && (x.k === 'num' || x.k === '(' || x.k === 'fn'); };
      var parseTerm = function(){
        var v = parseUnary();
        for (;;) {
          if (isOp('*')) { p++; v *= parseUnary(); }
          else if (isOp('/')) { p++; v /= parseUnary(); }
          else if (startsValue(peek())) { v *= parseUnary(); }   // implicit ×
          else return v;
        }
      };
      var parseUnary = function(){
        if (isOp('-')) { p++; return -parseUnary(); }
        if (isOp('+')) { p++; return parseUnary(); }
        return parsePower();
      };
      var parsePower = function(){
        var base = parsePrimary();
        if (isOp('^')) { p++; return Math.pow(base, parseUnary()); }
        return base;
      };
      var parsePrimary = function(){
        var x = t[p++];
        if (!x) throw new Error('unexpected end');
        if (x.k === 'num') return x.v;
        if (x.k === '(') {
          var v = parseExpr();
          if (t[p] && t[p].k === ')') p++;
          else if (t[p]) throw new Error('expected )');
          return v;
        }
        if (x.k === 'fn') return FNS[x.v](parsePrimary());
        throw new Error('unexpected ' + x.k);
      };
      var val = parseExpr();
      if (p < t.length) throw new Error('trailing');
      if (typeof val !== 'number' || !isFinite(val)) return null;
      return val;
    }catch(e){ return null; }
  }

  // ---------- Display ----------
  function setResultText(text){
    text = (text === null || text === undefined || text === '') ? '0' : String(text);
    resultEl.textContent = text;
    resultEl.classList.toggle('small', text.length > 8);
    resultEl.classList.toggle('tiny', text.length > 12);
  }

  function updateDisplay(){
    exprEl.textContent = justEvaluated && completedExpr ? prettify(completedExpr) + ' =' : ' ';
    setResultText(prettify(display || '0'));
    updateClearLabel();
  }

  function clearLabel(){ return (!display || justEvaluated || entryCleared) ? 'AC' : 'C'; }
  function updateClearLabel(){
    var label = clearLabel();
    document.querySelectorAll('[data-act="clear"]').forEach(function(btn){ btn.textContent = label; });
  }

  function resetRepeat(){ repeatOp = null; repeatOperand = null; }

  function lastChar(){ return display.slice(-1); }
  // True when the display ends with something a number could follow by implicit ×.
  function endsWithValue(){ return /[0-9.)πe]$/.test(display); }
  function endsWithClosedValue(){ return /[)πe]$/.test(display); }

  // Called before any input: a result is either continued (operators) or replaced (new numbers).
  function beginInput(keepResult){
    if (justEvaluated) {
      if (!keepResult) { display = ''; carry = null; }
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
    }
    entryCleared = false;
  }

  function currentNumber(){
    var m = display.match(/(\d*\.?\d*(?:E[+−]?\d*)?)$/);
    return m ? m[1] : '';
  }

  // ---------- Keys ----------
  function handleDigit(d){
    beginInput(false);
    if (endsWithClosedValue()) display += '×';
    var seg = currentNumber();
    if (seg === '0') {
      if (d === '0') { updateDisplay(); return; }
      display = display.slice(0, -1);
    }
    display += d;
    updateDisplay();
  }

  function handleDecimal(){
    beginInput(false);
    if (currentNumber().indexOf('.') >= 0 || /E/.test(currentNumber())) { updateDisplay(); return; }
    if (endsWithClosedValue()) display += '×';
    display += /[0-9]$/.test(display) ? '.' : '0.';
    updateDisplay();
  }

  function handleOp(sym){
    beginInput(true);
    var last = lastChar();
    if (!display || last === '(') {
      if (sym === MINUS) display += MINUS;          // unary minus
      updateDisplay();
      return;
    }
    if (isOperator(last)) {
      var before = display.slice(0, -1);
      if (!before || before.slice(-1) === '(') {     // the operator there is a unary minus
        if (sym !== MINUS) display = before;
        updateDisplay();
        return;
      }
      if (last === '^' && sym === MINUS) {           // 2^−2: negative exponent
        display += MINUS;
        updateDisplay();
        return;
      }
      if (isOperator(before.slice(-1))) {            // "2^−" then + → "2+"
        display = before.slice(0, -1) + sym;
        updateDisplay();
        return;
      }
      display = before + sym;                        // swap one operator for another
      updateDisplay();
      return;
    }
    if (FN_RE.test(display)) return;
    display += sym;
    updateDisplay();
  }

  function openParen(){
    beginInput(false);
    if (endsWithValue()) display += '×';
    display += '(';
    updateDisplay();
  }
  function closeParen(){
    beginInput(true);
    var opens = (display.match(/\(/g) || []).length, closes = (display.match(/\)/g) || []).length;
    if (opens > closes && endsWithValue()) display += ')';
    updateDisplay();
  }
  // The single ( ) key closes when a bracket is open and a value was just entered, otherwise opens.
  function handleParen(){
    var opens = (display.match(/\(/g) || []).length, closes = (display.match(/\)/g) || []).length;
    if (!justEvaluated && opens > closes && endsWithValue()) closeParen();
    else openParen();
  }

  function handleFn(name){
    if (justEvaluated) {                            // apply to the result: 16 = √ → √(16
      var res = display;
      beginInput(false);
      display = name + '(' + res;
      updateDisplay();
      return;
    }
    beginInput(false);
    if (endsWithValue()) display += '×';
    display += name + '(';
    updateDisplay();
  }

  function handleConst(name){
    beginInput(false);
    if (endsWithValue()) display += '×';
    display += name === 'pi' ? 'π' : 'e';
    updateDisplay();
  }

  // Index where the trailing operand starts (number, constant, (−n) or a bracketed group), or -1.
  function trailingOperandStart(){
    if (!display) return -1;
    if (lastChar() === ')') {
      var depth = 0;
      for (var i = display.length - 1; i >= 0; i--) {
        var ch = display.charAt(i);
        if (ch === ')') depth++;
        else if (ch === '(') { depth--; if (depth === 0) { var f = display.slice(0, i).match(/(sin|cos|tan|ln|log|sqrt)$/); return f ? i - f[1].length : i; } }
      }
      return -1;
    }
    var m = display.match(/(\d*\.?\d+\.?(?:E[+−]?\d+)?|[πe])$/);
    return m ? display.length - m[1].length : -1;
  }

  function handleSign(){
    if (justEvaluated) {
      var v = parseDisplayNum(display);
      if (!isNaN(v)) {
        var full = carry && carry.text === display ? carry.value : v;
        display = fmtNum(-full); carry = { text: display, value: -full };
        completedExpr = ''; resetRepeat(); updateDisplay();
      }
      return;
    }
    entryCleared = false;
    if (!display) { display = MINUS; updateDisplay(); return; }
    if (display === MINUS) { display = ''; updateDisplay(); return; }
    var start = trailingOperandStart();
    if (start < 0) return;
    var operand = display.slice(start), head = display.slice(0, start);
    var neg = operand.match(/^\(−(.*)\)$/);
    if (neg && evaluate(operand) !== null && neg[1].indexOf('(') < 0) {
      display = head + neg[1];                       // (−5) → 5
    } else if (head === MINUS) {
      display = operand;                             // −5 → 5
    } else if (!head) {
      display = MINUS + operand;                     // 5 → −5
    } else {
      display = head + '(' + MINUS + operand + ')';  // 3×5 → 3×(−5)
    }
    updateDisplay();
  }

  // Last binary operator at bracket depth 0 (a minus right after an operator, '(' or E is unary).
  function findLastBinaryParts(expr){
    expr = expr === undefined ? display : expr;
    var depth = 0;
    for (var i = expr.length - 1; i > 0; i--) {
      var ch = expr.charAt(i);
      if (ch === ')') { depth++; continue; }
      if (ch === '(') { depth--; continue; }
      if (depth !== 0 || !isOperator(ch)) continue;
      if (!/[0-9.)πe]/.test(expr.charAt(i - 1))) continue;
      var left = expr.slice(0, i), right = expr.slice(i + 1);
      if (left && right) return { left:left, op:ch, right:right };
    }
    return null;
  }

  function handlePercent(){
    if (justEvaluated) {
      var v = parseDisplayNum(display);
      if (isNaN(v)) return;
      if (carry && carry.text === display) v = carry.value;
      completedExpr = display + '%';
      display = fmtNum(v / 100);
      carry = { text: display, value: v / 100 };
      resetRepeat();
      updateDisplay();
      return;
    }
    entryCleared = false;
    if (!display || !endsWithValue()) return;
    var parts = findLastBinaryParts();
    if (!parts) {                                    // 50% → 0.5
      var whole = evaluate(display);
      if (whole !== null) { display = fmtNum(whole / 100); updateDisplay(); }
      return;
    }
    var leftVal = evaluate(parts.left), rightVal = evaluate(parts.right);
    if (leftVal === null || rightVal === null) return;
    // 100 + 10% → 100 + 10 ; 100 × 10% → 100 × 0.1
    var pct = (parts.op === '+' || parts.op === MINUS) ? leftVal * rightVal / 100 : rightVal / 100;
    display = parts.left + parts.op + operandText(pct);
    updateDisplay();
  }

  function operandText(v){ return v < 0 ? '(' + fmtNum(v) + ')' : fmtNum(v); }

  function handleBack(){
    if (justEvaluated) {                             // edit the result
      carry = null;
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
      if (/E|Error/.test(display)) display = '';
    }
    entryCleared = false;
    var fn = display.match(FN_RE);
    display = fn ? display.slice(0, -fn[0].length) : display.slice(0, -1);
    if (display === MINUS + '0' ) display = '';
    updateDisplay();
  }

  function handleClear(){
    display = '';
    carry = null;
    completedExpr = '';
    justEvaluated = false;
    entryCleared = false;
    resetRepeat();
    updateDisplay();
  }

  // C: remove the number being typed; the key then reads AC.
  function handleClearEntry(){
    if (justEvaluated || !display) { handleClear(); return; }
    var m = display.match(/(\(−)?(\d*\.?\d+\.?(?:E[+−]?\d*)?|\d+\.|[πe])\)?$/);
    if (!m || isOperator(lastChar()) || lastChar() === '(') { handleClear(); return; }
    display = display.slice(0, display.length - m[0].length);
    entryCleared = true;
    updateDisplay();
  }

  function handleEquals(){
    // Repeated equals: 5 + 2 = 7, = 9, = 11
    if (justEvaluated) {
      if (repeatOp === null) return;
      var current = carry && carry.text === display ? carry.value : parseDisplayNum(display);
      if (isNaN(current)) return;
      var repeatedExpr = operandText(current) + repeatOp + operandText(repeatOperand);
      var saved = carry; carry = null;
      var repeated = evaluate(repeatedExpr);
      carry = saved;
      if (repeated === null) { showError(repeatedExpr); return; }
      completedExpr = repeatedExpr;
      display = fmtNum(repeated);
      carry = { text: display, value: repeated };
      history.push({ expr: completedExpr, result: display });
      saveHistory(); renderHistory();
      updateDisplay();
      return;
    }
    if (!display) return;
    var expr = display;
    while (expr && (isOperator(expr.slice(-1)) || expr.slice(-1) === '(')) expr = expr.slice(0, -1);  // ignore a dangling operator
    if (!expr) return;
    var val = evaluate(expr);
    if (val === null) { showError(expr); return; }

    var parts = findLastBinaryParts(expr), rightVal = parts ? evaluate(parts.right) : null;
    if (parts && rightVal !== null) { repeatOp = parts.op; repeatOperand = rightVal; } else resetRepeat();

    var opens = (expr.match(/\(/g) || []).length, closes = (expr.match(/\)/g) || []).length;
    completedExpr = expr + new Array(Math.max(0, opens - closes) + 1).join(')');
    display = fmtNum(val);
    carry = { text: display, value: val };
    history.push({ expr: completedExpr, result: display });
    saveHistory(); renderHistory();
    justEvaluated = true;
    entryCleared = false;
    updateDisplay();
  }

  // Show Error with the failed sum above it; the next key starts a new calculation.
  function showError(expr){
    carry = null;
    completedExpr = expr;
    display = '';
    justEvaluated = true;
    entryCleared = false;
    resetRepeat();
    updateDisplay();
    setResultText('Error');
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function renderHistory(){
    if (!history.length){
      historyList.innerHTML = '<div class="history-empty">No calculations yet</div>';
      return;
    }

    historyList.innerHTML = history.slice(-30).map(function(h){
      return '<div class="history-item" data-res="'+encodeURIComponent(h.result)+'">' +
        '<div class="h-expr">'+escapeHtml(prettify(h.expr))+' =</div>' +
        '<div class="h-res">'+escapeHtml(prettify(h.result))+'</div></div>';
    }).join('');
  }

  historyList.addEventListener('click', function(e){
    var item = e.target.closest('.history-item');
    if (!item) return;
    // Older history may hold "-5" / "1e+16"; normalise to the current display form.
    var v = parseDisplayNum(decodeURIComponent(item.getAttribute('data-res')));
    if (isNaN(v)) return;
    display = fmtNum(v);
    completedExpr = '';
    justEvaluated = true;
    entryCleared = false;
    resetRepeat();
    updateDisplay();
    historyPanel.classList.remove('open');
  });

  clearHistoryBtn.addEventListener('click', function(){
    history = [];
    saveHistory();
    renderHistory();
  });

  historyBtn.addEventListener('click', function(){
    historyPanel.classList.toggle('open');
  });

  function bindPad(pad){
    pad.addEventListener('click', function(e){
      var btn = e.target.closest('button.key');
      if (!btn) return;

      var act = btn.getAttribute('data-act');
      var val = btn.getAttribute('data-val');

      switch(act){
        case 'digit': handleDigit(val); break;
        case 'op': handleOp(val); break;
        case 'decimal': handleDecimal(); break;
        case 'fn': handleFn(val); break;
        case 'const': handleConst(val); break;
        case 'paren': handleParen(); break;
        case 'sign': handleSign(); break;
        case 'percent': handlePercent(); break;
        case 'back': handleBack(); break;
        case 'clear': if (clearLabel() === 'C') handleClearEntry(); else handleClear(); break;
        case 'equals': handleEquals(); break;
      }
    });
  }

  bindPad(padBasic);
  bindPad(padSci);

  // Swipe left or right across the display to delete the last digit (as on iPhone).
  (function(){
    var sx = null, sy = null;
    displayPanel.addEventListener('touchstart', function(e){ var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive:true });
    displayPanel.addEventListener('touchend', function(e){
      if (sx === null || historyPanel.classList.contains('open')) return;
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      sx = null;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) handleBack();
    });
  })();

  function setMode(mode){
    currentMode = mode;
    modeBasic.classList.toggle('active', mode==='basic');
    modeSci.classList.toggle('active', mode==='sci');
    modeConvert.classList.toggle('active', mode==='convert');

    padBasic.style.display = mode==='basic' ? 'grid' : 'none';
    padSci.style.display = mode==='sci' ? 'grid' : 'none';
    padConvert.style.display = mode==='convert' ? 'flex' : 'none';
    displayPanel.style.display = mode==='convert' ? 'none' : 'flex';
  }

  modeBasic.addEventListener('click', function(){ setMode('basic'); });
  modeSci.addEventListener('click', function(){ setMode('sci'); });
  modeConvert.addEventListener('click', function(){ setMode('convert'); });

  document.addEventListener('keydown', function(e){
    if (currentMode === 'convert' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var k = e.key;

    if (/^[0-9]$/.test(k)) { handleDigit(k); return; }
    if (k === '.' || k === ',') { handleDecimal(); return; }
    if (k === '+') { handleOp('+'); return; }
    if (k === '-') { handleOp(MINUS); return; }
    if (k === '*' || k === 'x' || k === 'X') { handleOp('×'); return; }
    if (k === '/') { e.preventDefault(); handleOp('÷'); return; }
    if (k === '^') { handleOp('^'); return; }
    if (k === '(') { openParen(); return; }
    if (k === ')') { closeParen(); return; }
    if (k === '%') { handlePercent(); return; }
    if (k === 'Enter' || k === '=') { e.preventDefault(); handleEquals(); return; }
    if (k === 'Backspace') { handleBack(); return; }
    if (k === 'Escape' || k === 'Delete') { handleClear(); return; }
  });

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      toastEl.classList.remove('show');
    },1200);
  }

  function copyText(text){
    function done(){ showToast('Copied'); }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }

    function fallbackCopy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position='fixed';
        ta.style.left='-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e){}
    }
  }

  function bindLongPressCopy(el,getText){
    var timer;

    function start(){
      timer=setTimeout(function(){
        copyText(getText());
      },480);
    }

    function cancel(){
      clearTimeout(timer);
    }

    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',cancel);
    el.addEventListener('touchmove',cancel);
    el.addEventListener('mousedown',start);
    el.addEventListener('mouseup',cancel);
    el.addEventListener('mouseleave',cancel);
  }

  bindLongPressCopy(resultEl,function(){
    return resultEl.textContent;
  });

  var pasteTarget='calc';

  if (pasteBtn) {
    pasteBtn.addEventListener('click',function(){
      pasteTarget=currentMode==='convert'?'convert':'calc';
      pasteOverlay.classList.add('open');
      pasteInput.value='';
      pasteInput.focus();
    });
  }

  pasteInput.addEventListener('input',function(){
    var v=pasteInput.value.trim();
    var num=parseFloat(v.replace(/,/g,''));

    if (!isNaN(num)){
      if (pasteTarget==='convert'){
        convValueInput.value=num.toString();
        updateConversion();
      }else{
        display=fmtNum(num);
        completedExpr='';
        justEvaluated=false;
        entryCleared=false;
        resetRepeat();
        updateDisplay();
      }

      pasteOverlay.classList.remove('open');
      pasteInput.blur();
      showToast('Pasted');
    }
  });

  pasteInput.addEventListener('blur',function(){
    setTimeout(function(){
      pasteOverlay.classList.remove('open');
    },150);
  });

  var CATEGORIES={

      {key:'mm',label:'Millimetres',abbr:'mm',factor:0.001},

      {key:'km',label:'Kilometres',abbr:'km',factor:1000},
      {key:'in',label:'Inches',abbr:'in',factor:0.0254},
      {key:'ft',label:'Feet',abbr:'ft',factor:0.3048},
      {key:'yd',label:'Yards',abbr:'yd',factor:0.9144},

    ],defaultFrom:'km',defaultTo:'mi'},

    weight:{label:'Weight',units:[
      {key:'mg',label:'Milligrams',abbr:'mg',factor:0.000001},
      {key:'g',label:'Grams',abbr:'g',factor:0.001},
      {key:'kg',label:'Kilograms',abbr:'kg',factor:1},
      {key:'oz',label:'Ounces',abbr:'oz',factor:0.028349523125},

    ],defaultFrom:'kg',defaultTo:'lb'},

    temp:{label:'Temperature',units:[
      {key:'c',label:'Celsius',abbr:'\u00B0C'},
      {key:'f',label:'Fahrenheit',abbr:'\u00B0F'},
      {key:'k',label:'Kelvin',abbr:'K'}
    ],defaultFrom:'c',defaultTo:'f'},

    volume:{label:'Volume',units:[
      {key:'ml',label:'Millilitres',abbr:'mL',factor:0.001},
      {key:'l',label:'Litres',abbr:'L',factor:1},
      {key:'m3',label:'Cubic metres',abbr:'m\u00B3',factor:1000},
      {key:'tsp',label:'Teaspoons',abbr:'tsp',factor:0.005},
      {key:'tbsp',label:'Tablespoons (AU)',abbr:'tbsp',factor:0.02},
      {key:'floz',label:'Fluid ounces (US)',abbr:'fl oz',factor:0.0295735295625},
      {key:'cup',label:'Cups (AU)',abbr:'cup',factor:0.25},
      {key:'pt',label:'Pints (US)',abbr:'pt',factor:0.473176473},
      {key:'qt',label:'Quarts (US)',abbr:'qt',factor:0.946352946},
      {key:'gal',label:'Gallons (US)',abbr:'gal',factor:3.785411784}
    ],defaultFrom:'l',defaultTo:'gal'},

    area:{label:'Area',units:[
      {key:'m2',label:'Square metres',abbr:'m\u00B2',factor:1},
      {key:'km2',label:'Square kilometres',abbr:'km\u00B2',factor:1000000},
      {key:'ft2',label:'Square feet',abbr:'ft\u00B2',factor:0.09290304},
      {key:'yd2',label:'Square yards',abbr:'yd\u00B2',factor:0.83612736},
      {key:'acre',label:'Acres',abbr:'ac',factor:4046.8564224},
      {key:'ha',label:'Hectares',abbr:'ha',factor:10000},
      {key:'mi2',label:'Square miles',abbr:'mi\u00B2',factor:2589988.110336}
    ],defaultFrom:'m2',defaultTo:'ft2'}
  };

  var CAT_ORDER=['length','weight','temp','volume','area'];
  var currentCat='length',currentFromUnit,currentToUnit;

  var catRow=document.getElementById('catRow');
  var fromSelect=document.getElementById('fromSelect');
  var toSelect=document.getElementById('toSelect');
  var convValueInput=document.getElementById('convValueInput');
  var swapBtn=document.getElementById('swapBtn');
  var convResultValue=document.getElementById('convResultValue');
  var convResultUnit=document.getElementById('convResultUnit');

  function buildCatChips(){
    catRow.innerHTML=CAT_ORDER.map(function(key){
      var c=CATEGORIES[key];
      return '<button class="cat-chip'+(key===currentCat?' active':'')+'" data-cat="'+key+'">'+c.label+'</button>';
    }).join('');
  }

  catRow.addEventListener('click',function(e){
    var chip=e.target.closest('.cat-chip');
    if(!chip)return;

    currentCat=chip.getAttribute('data-cat');
    buildCatChips();
    populateSelects();
    updateConversion();
  });

  function populateSelects(){
    var cat=CATEGORIES[currentCat];
    var opts=cat.units.map(function(u){
      return '<option value="'+u.key+'">'+u.label+'</option>';
    }).join('');

    fromSelect.innerHTML=opts;
    toSelect.innerHTML=opts;
    fromSelect.value=currentFromUnit=cat.defaultFrom;
    toSelect.value=currentToUnit=cat.defaultTo;
  }

  fromSelect.addEventListener('change',function(){
    currentFromUnit=fromSelect.value;
    updateConversion();
  });

  toSelect.addEventListener('change',function(){
    currentToUnit=toSelect.value;
    updateConversion();
  });

  convValueInput.addEventListener('input',updateConversion);

  swapBtn.addEventListener('click',function(){
    var tmp=currentFromUnit;
    currentFromUnit=currentToUnit;
    currentToUnit=tmp;
    fromSelect.value=currentFromUnit;
    toSelect.value=currentToUnit;
    updateConversion();
  });

  function unitAbbr(catKey,unitKey){
    var u=CATEGORIES[catKey].units.filter(function(x){
      return x.key===unitKey;
    })[0];
    return u?u.abbr:'';
  }

  function convertTemp(v,from,to){
    var c;
    if(from==='c')c=v;
    else if(from==='f')c=(v-32)*5/9;
    else c=v-273.15;

    if(to==='c')return c;
    if(to==='f')return c*9/5+32;
    return c+273.15;
  }

  function convertVal(value,fromKey,toKey,catKey){
    if(catKey==='temp')return convertTemp(value,fromKey,toKey);

    var cat=CATEGORIES[catKey];
    var fromU=cat.units.filter(function(u){return u.key===fromKey;})[0];
    var toU=cat.units.filter(function(u){return u.key===toKey;})[0];

    return(value*fromU.factor)/toU.factor;
  }

  function updateConversion(){
    var val=parseFloat(String(convValueInput.value).replace(/,/g,'').replace(/\u2212/g,'-'));

    if(isNaN(val)){
      convResultValue.textContent='0';
      convResultUnit.textContent=unitAbbr(currentCat,currentToUnit);
      return;
    }

    var result=convertVal(val,currentFromUnit,currentToUnit,currentCat);
    convResultValue.textContent=prettify(fmtNum(result));
    convResultUnit.textContent=unitAbbr(currentCat,currentToUnit);
  }

  bindLongPressCopy(convResultValue,function(){
    return convResultValue.textContent;
  });

  // Theme
  var themeBtn=document.getElementById('themeBtn');

  function applyTheme(theme){
    document.body.classList.toggle('dark',theme==='dark');
    if(themeBtn)themeBtn.innerHTML=theme==='dark'?'&#9788;':'&#9790;';
    try{localStorage.setItem('calc_theme_v4',theme);}catch(e){}
  }

  var savedTheme='light';
  try{
    savedTheme=localStorage.getItem('calc_theme_v4') ||
               localStorage.getItem('calc_theme_v2') ||
               'light';
  }catch(e){}

  applyTheme(savedTheme);

  if(themeBtn){
    themeBtn.addEventListener('click',function(){
      applyTheme(document.body.classList.contains('dark')?'light':'dark');
    });
  }

  // Pinch zoom is blocked; double-tap zoom is already off via touch-action: manipulation.
  document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});

  buildCatChips();
  populateSelects();
  updateConversion();
  loadHistory();
  updateDisplay();
})();
</script>

<script>
(function(){
  // Fast taps on the keypad: press on touchend without the browser's click delay,
  // but only if the finger lifts on the same key (sliding off cancels, like iOS).
  document.querySelectorAll('button.key').forEach(function(btn){
    btn.addEventListener('touchstart', function(){ btn.style.transform = 'scale(.96)'; }, { passive:true });
    btn.addEventListener('touchcancel', function(){ btn.style.transform = ''; });
    btn.addEventListener('touchend', function(e){
      btn.style.transform = '';
      e.preventDefault();                       // stop the delayed synthetic click (no double press)
      var t = e.changedTouches[0];
      var under = t && document.elementFromPoint(t.clientX, t.clientY);
      if (under && btn.contains(under)) btn.click();
    }, { passive:false });
  });
})();
</script>
