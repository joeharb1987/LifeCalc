<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LifeCalc">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./lifecalc-icon.svg">
<link rel="apple-touch-icon" href="./lifecalc-icon-180.png">
<title>LifeCalc</title>
<style>
/* LifeCalc calculator — modelled on the iPhone (iOS 18) Calculator.
   Key size is set from JS (--key, --gap) so the keypad always fits above the tab bar. */
:root{
  --bg:#F2F2F7;
  --text:#000000;
  --text-dim:#8A8A8E;
  --digit:#FFFFFF;
  --digit-text:#000000;
  --fn:#D4D4D2;
  --fn-text:#000000;
  --sci:#E5E5EA;
  --sci-text:#000000;
  --op:#FF9F0A;
  --op-text:#FFFFFF;
  --op-active-bg:#FFFFFF;
  --op-active-text:#FF9F0A;
  --digit-press:#D9D9DE;
  --fn-press:#B8B8BC;
  --sci-press:#C7C7CC;
  --op-press:#FFC57A;
  --sheet:#FFFFFF;
  --line:rgba(60,60,67,.18);
  --key-border:rgba(60,60,67,.18);
  --top-btn:#FFFFFF;
  --amber:#FF9F0A;
  --shadow:0 1px 1px rgba(0,0,0,.06);
  --key:76px;
  --gap:14px;
}
body.dark{
  --bg:#000000;
  --text:#FFFFFF;
  --text-dim:#8E8E93;
  --digit:#323234;
  --digit-text:#FFFFFF;
  --fn:#5C5C5F;
  --fn-text:#FFFFFF;
  --sci:#1F1F21;
  --sci-text:#FFFFFF;
  --op:#F19A38;
  --op-text:#FFFFFF;
  --op-active-bg:#FFFFFF;
  --op-active-text:#F19A38;
  --digit-press:#737375;
  --fn-press:#9A9A9D;
  --sci-press:#4A4A4D;
  --op-press:#FCC78D;
  --sheet:#1C1C1E;
  --line:rgba(84,84,88,.6);
  --key-border:rgba(84,84,88,.45);
  --top-btn:#121212;
  --shadow:none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
button,input,select{font:inherit;color:inherit;}
button{cursor:pointer;}

.app{
  position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 14px);
}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:50px;flex:0 0 auto;}
.round-btn{width:46px;height:46px;border:0;border-radius:50%;background:#1C1C1E;color:#fff;display:grid;place-items:center;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.round-btn svg{width:24px;height:24px;}
.icon-btn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--op);display:grid;place-items:center;padding:0;}
.icon-btn svg{width:24px;height:24px;}
.topbar-title{font-size:17px;font-weight:600;}
.done-btn{border:0;background:transparent;color:var(--op);font-size:17px;font-weight:600;padding:10px 4px;}
.done-btn[hidden]{display:none;}

/* ---------- Display ---------- */
.display{position:relative;flex:1 1 auto;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 calc((100% - (4 * var(--key) + 3 * var(--gap))) / 2 + 6px) 10px;overflow:hidden;}
.expr{min-height:30px;color:var(--text-dim);text-align:right;font-size:28px;font-weight:400;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;direction:ltr;letter-spacing:-.01em;cursor:pointer;}
.result{color:var(--text);text-align:right;font-size:68px;font-weight:300;line-height:1.05;letter-spacing:-.035em;white-space:nowrap;
  overflow:hidden;cursor:pointer;font-variant-numeric:tabular-nums;}

/* ---------- Keypad ---------- */
.pad{display:grid;justify-content:center;flex:0 0 auto;}
.pad.basic{grid-template-columns:repeat(4,var(--key));grid-auto-rows:var(--key);gap:var(--gap);padding-top:var(--gap);}
.pad.sci{grid-template-columns:repeat(6,1fr);grid-auto-rows:var(--sci-row,40px);column-gap:var(--sgap,8px);row-gap:var(--sgap,8px);
  width:calc(4 * var(--key) + 3 * var(--gap));margin:0 auto;}
.pad[hidden]{display:none;}

button.key{border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0;
  background:var(--digit);background-image:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 60%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px rgba(255,255,255,.05)!important;color:var(--digit-text);box-shadow:var(--shadow);
  font-size:calc(var(--key) * .42);font-weight:400;line-height:1;transition:filter .25s ease, background-color .2s ease, color .2s ease;}
button.key:active,button.key.pressed{background:var(--digit-press);transition:none;}
.k-fn:active,.k-fn.pressed{background:var(--fn-press)!important;}
.k-op:active,.k-op.pressed,.k-eq:active,.k-eq.pressed{background:var(--op-press)!important;}
.k-sci:active,.k-sci.pressed{background:var(--sci-press)!important;}
.k-fn{background:linear-gradient(180deg,#6E6E70,#575759)!important;color:var(--fn-text)!important;font-size:calc(var(--key) * .36)!important;}
.k-op,.k-eq{background:linear-gradient(180deg,#F5A447,#EE9330)!important;color:var(--op-text)!important;font-size:calc(var(--key) * .48)!important;font-weight:500!important;}
button.key.k-op.operator-active{background:var(--op-active-bg)!important;color:var(--op-active-text)!important;}
.k-sci{background:var(--sci)!important;color:var(--sci-text)!important;font-size:min(calc(var(--sci-row,40px) * .42),17px)!important;}
.k-sci.second-on,.k-sci.mem-on{background:#5C5C5F!important;}
.k-sci sub{font-size:.62em;}
.angle-badge{position:absolute;left:calc((100% - (4 * var(--key) + 3 * var(--gap))) / 2 + 6px);bottom:22px;font-size:15px;color:var(--text-dim);}
.angle-badge[hidden]{display:none;}
.clip-menu{position:absolute;z-index:35;display:flex;background:#3A3A3C;border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.45);animation:clipIn .12s ease-out;}
.clip-menu::after{content:"";position:absolute;bottom:-6px;right:var(--arrow,24px);border:6px solid transparent;border-bottom:0;border-top-color:#3A3A3C;}
@keyframes clipIn{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
.clip-menu[hidden]{display:none;}
.clip-menu button{border:0;background:transparent;color:#fff;font-size:14px;font-weight:500;padding:8px 14px;}
.clip-menu button + button{border-left:1px solid rgba(255,255,255,.15);}
.k-sci.k-sci-op{color:var(--op)!important;}
.key svg{width:42%;height:42%;}
.k-fn svg{width:44%;height:44%;}
.key[data-act="sign"] svg{width:46%;height:46%;}
.key sup{font-size:.6em;line-height:0;position:relative;top:-.5em;margin-left:1px;vertical-align:baseline;}

/* ---------- Mode menu (bottom-left calculator key) ---------- */
.mode-menu{position:absolute;z-index:30;min-width:220px;background:var(--sheet);border-radius:14px;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);transform-origin:top right;border-radius:24px;animation:menuIn .16s ease-out;}
.mode-menu[hidden]{display:none;}
@keyframes menuIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:none;}}
.mode-menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--text);
  padding:13px 16px;font-size:17px;text-align:left;border-top:1px solid var(--line);}
.mode-menu button:first-child{border-top:0;}
.mode-menu button .tick{width:18px;color:var(--op);font-weight:700;visibility:hidden;}
.mode-menu button.active .tick{visibility:visible;}
.mode-menu .sep{height:1px;background:rgba(255,255,255,.12);margin:2px 16px;}
.mode-menu .mi{width:32px;text-align:center;font-size:16px;color:var(--text);opacity:.9;}
.mode-menu button{border-top:0!important;padding:12px 18px!important;}
.mode-menu a{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;padding:12px 18px;font-size:17px;}
.mode-menu a .tick{width:18px;visibility:hidden;}
.mode-menu .mi svg{display:block;margin:0 auto;}

/* ---------- History ---------- */
.history-panel{position:absolute;inset:0 0 6px;display:none;flex-direction:column;padding:14px 16px;border-radius:20px;
  background:var(--sheet);color:var(--text);z-index:10;border:1px solid var(--line);}
.history-panel.open{display:flex;}
.history-panel h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;}
.history-panel .clear{color:var(--op);font-weight:500;cursor:pointer;}
.history-list{overflow:auto;display:flex;flex-direction:column-reverse;gap:2px;}
.history-item{padding:10px 0;border-bottom:1px solid var(--line);text-align:right;cursor:pointer;}
.history-item .h-expr{font-size:16px;color:var(--text-dim);}
.history-item .h-res{font-size:28px;font-weight:300;}
.history-empty{margin-top:40px;text-align:center;color:var(--text-dim);}

.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) translateY(8px);background:rgba(120,120,128,.9);color:#fff;
  font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.18s ease;z-index:30;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.paste-overlay{position:absolute;top:calc(env(safe-area-inset-top) + 56px);left:16px;right:16px;z-index:25;display:none;}
.paste-overlay.open{display:block;}
.paste-overlay input{width:100%;height:48px;border:1px solid var(--line);background:var(--sheet);color:var(--text);border-radius:12px;
  padding:0 14px;font-size:17px;outline:none;}

/* ---------- Converter ---------- */
.convert-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-top:8px;overflow:auto;}
.convert-panel[hidden]{display:none;}
.cat-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.cat-row::-webkit-scrollbar{display:none;}
.cat-chip{flex:0 0 auto;border:0;background:var(--digit);color:var(--digit-text);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:500;box-shadow:var(--shadow);}
.cat-chip.active{background:var(--op);color:#fff;}
.conv-card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.conv-card label{font-size:13px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.conv-card select{border:0;background:transparent;color:var(--text);font-size:19px;font-weight:500;padding:4px 0;outline:none;-webkit-appearance:none;appearance:none;}
.conv-value{border:0;background:transparent;color:var(--text);font-size:44px;font-weight:300;padding:0;outline:none;width:100%;
  user-select:text;-webkit-user-select:text;}
.swap-row{display:flex;justify-content:center;margin:-4px 0;}
.swap-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--op);color:#fff;font-size:22px;}
.conv-result{text-align:right;padding:8px 4px;}
.conv-result .r-unit{color:var(--text-dim);font-size:15px;}
.conv-result .r-value{font-size:56px;font-weight:300;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;}

html{background:#000;}
</style>
</head>
<body class="dark">
<div class="app" id="calcApp">
  <div class="topbar">
    <button class="round-btn" id="historyBtn" aria-label="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5H8.5"/></svg>
    </button>
    <div class="topbar-title" id="modeTitle"></div>
    <button class="round-btn" id="modeMenuBtn" data-act="menu" aria-label="Calculator mode" aria-haspopup="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8 6.5h8v3H8z"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg></button>
  </div>

  <div class="paste-overlay" id="pasteOverlay">
    <input type="text" id="pasteInput" inputmode="decimal" autocomplete="off" placeholder="Tap and hold to paste a number">
  </div>

  <div class="display" id="displayPanel">
    <div class="expr" id="exprEl">&nbsp;</div>
    <div class="result" id="resultEl">0</div>
    <div class="toast" id="toastEl">Copied</div>
    <div class="angle-badge" id="angleBadge" hidden>Rad</div>
    <div class="clip-menu" id="clipMenu" role="menu" hidden><button id="clipCopy" role="menuitem">Copy</button><button id="clipPaste" role="menuitem">Paste</button></div>

    <div class="history-panel" id="historyPanel">
      <h3>History <span class="clear" id="clearHistory">Clear</span></h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- Scientific keys (same set as the iPhone Calculator) sit above the standard keypad -->
  <div class="pad sci" id="padSci" hidden>
    <button class="key k-sci" data-act="open" aria-label="Open bracket">(</button>
    <button class="key k-sci" data-act="close" aria-label="Close bracket">)</button>
    <button class="key k-sci" data-act="mem" data-val="mc" aria-label="Memory clear">mc</button>
    <button class="key k-sci" data-act="mem" data-val="m+" aria-label="Memory add">m+</button>
    <button class="key k-sci" data-act="mem" data-val="m-" aria-label="Memory subtract">m&minus;</button>
    <button class="key k-sci" data-act="mem" data-val="mr" id="memRecall" aria-label="Memory recall">mr</button>

    <button class="key k-sci" data-act="second" id="secondKey" aria-label="Second functions">2<sup>nd</sup></button>
    <button class="key k-sci" data-act="unary" data-val="sq" aria-label="Square">x<sup>2</sup></button>
    <button class="key k-sci" data-act="unary" data-val="cube" aria-label="Cube">x<sup>3</sup></button>
    <button class="key k-sci k-sci-op" data-act="op" data-val="^" aria-label="Power">x<sup>y</sup></button>
    <button class="key k-sci" data-act="unary" data-val="exp" aria-label="e to the x">e<sup>x</sup></button>
    <button class="key k-sci" data-act="unary" data-val="pow10" data-alt="pow2" data-alt-label="2<sup>x</sup>" aria-label="10 to the x">10<sup>x</sup></button>

    <button class="key k-sci" data-act="unary" data-val="inv" aria-label="Reciprocal"><sup>1</sup>&frasl;<sub>x</sub></button>
    <button class="key k-sci" data-act="unary" data-val="sqrt" aria-label="Square root"><sup>2</sup>&radic;x</button>
    <button class="key k-sci" data-act="unary" data-val="cbrt" aria-label="Cube root"><sup>3</sup>&radic;x</button>
    <button class="key k-sci k-sci-op" data-act="op" data-val="&radic;" aria-label="Y root of x"><sup>y</sup>&radic;x</button>
    <button class="key k-sci" data-act="unary" data-val="ln" aria-label="Natural log">ln</button>
    <button class="key k-sci" data-act="unary" data-val="log" data-alt="log2" data-alt-label="log<sub>2</sub>" aria-label="Log base 10">log<sub>10</sub></button>

    <button class="key k-sci" data-act="unary" data-val="fact" aria-label="Factorial">x!</button>
    <button class="key k-sci" data-act="unary" data-val="sin" data-alt="asin" data-alt-label="sin<sup>&minus;1</sup>">sin</button>
    <button class="key k-sci" data-act="unary" data-val="cos" data-alt="acos" data-alt-label="cos<sup>&minus;1</sup>">cos</button>
    <button class="key k-sci" data-act="unary" data-val="tan" data-alt="atan" data-alt-label="tan<sup>&minus;1</sup>">tan</button>
    <button class="key k-sci" data-act="const" data-val="e">e</button>
    <button class="key k-sci" data-act="ee" aria-label="Exponent">EE</button>

    <button class="key k-sci" data-act="angle" id="angleKey" aria-label="Switch to radians">Rad</button>
    <button class="key k-sci" data-act="unary" data-val="sinh" data-alt="asinh" data-alt-label="sinh<sup>&minus;1</sup>">sinh</button>
    <button class="key k-sci" data-act="unary" data-val="cosh" data-alt="acosh" data-alt-label="cosh<sup>&minus;1</sup>">cosh</button>
    <button class="key k-sci" data-act="unary" data-val="tanh" data-alt="atanh" data-alt-label="tanh<sup>&minus;1</sup>">tanh</button>
    <button class="key k-sci" data-act="const" data-val="pi">&pi;</button>
    <button class="key k-sci" data-act="const" data-val="rand" aria-label="Random number">Rand</button>
  </div>

  <div class="pad basic" id="padBasic">
    <button class="key k-fn" data-act="back" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 5H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.2a2 2 0 0 1-1.5-.7L2.5 12l5.2-6.3A2 2 0 0 1 9.2 5Z"/><path d="m11.5 9.5 5 5M16.5 9.5l-5 5"/></svg></button>
    <button class="key k-fn" data-act="clear" aria-label="All clear">AC</button>
    <button class="key k-fn" data-act="percent" aria-label="Percent">%</button>
    <button class="key k-op" data-act="op" data-val="&divide;" aria-label="Divide">&divide;</button>

    <button class="key" data-act="digit" data-val="7">7</button>
    <button class="key" data-act="digit" data-val="8">8</button>
    <button class="key" data-act="digit" data-val="9">9</button>
    <button class="key k-op" data-act="op" data-val="&times;" aria-label="Multiply">&times;</button>

    <button class="key" data-act="digit" data-val="4">4</button>
    <button class="key" data-act="digit" data-val="5">5</button>
    <button class="key" data-act="digit" data-val="6">6</button>
    <button class="key k-op" data-act="op" data-val="&minus;" aria-label="Minus">&minus;</button>

    <button class="key" data-act="digit" data-val="1">1</button>
    <button class="key" data-act="digit" data-val="2">2</button>
    <button class="key" data-act="digit" data-val="3">3</button>
    <button class="key k-op" data-act="op" data-val="+" aria-label="Plus">+</button>

    <button class="key" data-act="sign" aria-label="Plus minus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6.5h6M6 3.5v6M17 4 7 20M15 17.5h6"/></svg></button>
    <button class="key" data-act="digit" data-val="0">0</button>
    <button class="key" data-act="decimal" aria-label="Decimal point">.</button>
    <button class="key k-eq" data-act="equals" aria-label="Equals">=</button>
  </div>

  <div class="mode-menu" id="modeMenu" role="menu" hidden>
    <button id="modeBasic" class="active" role="menuitemradio"><span class="tick">&#10003;</span><span class="mi">&plusmn;&divide;</span>Basic</button>
    <button id="modeSci" role="menuitemradio"><span class="tick">&#10003;</span><span class="mi"><i>f</i>(x)</span>Scientific</button>
    <div class="sep"></div>
    <button id="modeConvert" role="menuitemradio"><span class="tick">&#10003;</span><span class="mi">&#8646;</span>Convert</button>
    <div class="sep"></div>
    <a href="./budget/#budget" role="menuitem"><span class="tick">&#10003;</span><span class="mi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Budget</a>
    <a href="./budget/#debts" role="menuitem"><span class="tick">&#10003;</span><span class="mi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.5h19"/><path d="M6.5 15h3"/></svg></span>Debts</a>
    <a href="./budget/#more" role="menuitem"><span class="tick">&#10003;</span><span class="mi"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></span>Settings</a>
  </div>

  <div class="convert-panel" id="padConvert" hidden>
    <div class="cat-row" id="catRow"></div>

    <div class="conv-card">
      <label>From</label>
      <select id="fromSelect"></select>
      <input type="text" class="conv-value" id="convValueInput" inputmode="decimal" value="1">
    </div>

    <div class="swap-row">
      <button class="swap-btn" id="swapBtn" aria-label="Swap units">&#8645;</button>
    </div>

    </div>

<script>
(function(){
  var exprEl = document.getElementById('exprEl');
  var resultEl = document.getElementById('resultEl');
  var historyPanel = document.getElementById('historyPanel');
  var historyList = document.getElementById('historyList');
  var historyBtn = document.getElementById('historyBtn');
  var clearHistoryBtn = document.getElementById('clearHistory');
  var padBasic = document.getElementById('padBasic');
  var padSci = document.getElementById('padSci');
  var padConvert = document.getElementById('padConvert');
  var displayPanel = document.getElementById('displayPanel');
  var modeBasic = document.getElementById('modeBasic');
  var modeSci = document.getElementById('modeSci');
  var modeConvert = document.getElementById('modeConvert');
  var toastEl = document.getElementById('toastEl');
  var pasteBtn = document.getElementById('pasteBtn');
  var pasteOverlay = document.getElementById('pasteOverlay');
  var pasteInput = document.getElementById('pasteInput');

  var display = '';          // expression being built, e.g. "12×(3+4)" — uses − × ÷ and sqrt( etc.
  var completedExpr = '';    // expression shown above the result after =
  var justEvaluated = false; // display holds a result
  var history = [];
  var currentMode = 'basic';
  var repeatOp = null;
  var repeatOperand = null;
  var carry = null;
  var pendingFn = null;      // function pressed right after a result: typing a number replaces the result          // { text, value }: the full-precision number behind a displayed result

  var FN_RE = new RegExp('(' + FN_NAMES + ')\\($');

  function loadHistory(){
    try{
      var s = localStorage.getItem('calc_history_v4');
      if (!s) s = localStorage.getItem('calc_history_v1');
      history = s ? JSON.parse(s) : [];
    }catch(e){ history = []; }
    renderHistory();
  }

  function saveHistory(){
    try{ localStorage.setItem('calc_history_v4', JSON.stringify(history.slice(-30))); }catch(e){}
  }

  // ---------- Numbers ----------
  // Result → display text. Uses − for negatives and E for scientific notation
  // (lower-case e is the constant), integers up to 15 digits shown in full.
  function fmtNum(n){
    if (!isFinite(n)) return 'Error';
    if (Math.abs(n) < 1e-14) n = 0;
    var abs = Math.abs(n), s;
    if (abs >= 1e15 || (abs > 0 && abs < 1e-9)) {
      s = n.toExponential(9).replace(/\.?0+e/, 'e');
    } else {
      var whole = Number(n.toPrecision(15));
      var v = Number.isInteger(whole) ? whole : Number(n.toPrecision(12));

    }

  }

  function parseDisplayNum(s){
    return parseFloat(String(s).replace(/,/g, '').replace(/−/g, '-').replace('E', 'e'));
  }

  // Thousands separators on integer parts, √ for sqrt — display only.
  var FN_LABELS = { sqrt:'√', cbrt:'∛', asin:'sin⁻¹', acos:'cos⁻¹', atan:'tan⁻¹', asinh:'sinh⁻¹', acosh:'cosh⁻¹', atanh:'tanh⁻¹', log:'log₁₀', log2:'log₂' };
  function prettify(expr){
    return String(expr)
      .replace(/√/g, 'ʸ√')
      .replace(new RegExp('(' + FN_NAMES + ')\\(', 'g'), function(m, f){ return (FN_LABELS[f] || f) + '('; })
      .replace(/(\d+)(\.\d*)?/g, function(m, int, frac, offset, whole){
        if (whole.charAt(offset - 1) === 'E' || whole.charAt(offset - 2) === 'E') return m;  // exponent digits

      });
  }

  // ---------- Expression parser (no eval) ----------
  // Precedence: unary minus < ^ (right-assoc), so −2^2 = −4 and 2^3^2 = 512.
  // Implicit multiplication: 2π, 2(3), (2)(3), 2√9. Missing ) are closed at the end.
  function tokenize(s){
    var t = [], i = 0, m;
    while (i < s.length) {

      // A carried-over result keeps its full precision (the display shows it rounded).
      if (carry && !/[0-9.E]/.test(s.charAt(i - 1)) && rest.indexOf(carry.text) === 0 && !/^[0-9.E]/.test(rest.slice(carry.text.length))) {

      }
      if ((m = rest.match(/^(\d+\.?\d*|\.\d+)(E[+−-]?\d+)?/))) {

      }
      if (c === '.') throw new Error('bad number');
      if (c === 'π') { t.push({ k:'num', v: Math.PI }); i++; continue; }
      if (c === 'e') { t.push({ k:'num', v: Math.E }); i++; continue; }
      if ((m = rest.match(new RegExp('^(' + FN_NAMES + ')(?=\\()')))) { t.push({ k:'fn', v: m[1] }); i += m[1].length; continue; }
      if (c === '√') { t.push({ k:'op', v:'root' }); i++; continue; }
      if (c === '!') { t.push({ k:'!' }); i++; continue; }
      if (c === '+' ) { t.push({ k:'op', v:'+' }); i++; continue; }
      if (c === MINUS || c === '-') {

        // (−2^2 = 4 and 2^−2 = 0.25, as on a phone calculator).

        if (unary && (m = s.slice(i + 1).match(/^(\d+\.?\d*|\.\d+)(E[+\u2212-]?\d+)?/))) {
          t.push({ k:'num', v: -parseDisplayNum(m[0]) }); i += 1 + m[0].length; continue;
        }
        t.push({ k:'op', v:'-' }); i++; continue;
      }
      if (c === '×' || c === '*') { t.push({ k:'op', v:'*' }); i++; continue; }
      if (c === '÷' || c === '/') { t.push({ k:'op', v:'/' }); i++; continue; }
      if (c === '^') { t.push({ k:'op', v:'^' }); i++; continue; }

  }

  // Trig follows the Deg/Rad setting; inverse trig answers in the same unit.
  function makeFns(){
    var k = angleMode === 'deg' ? Math.PI / 180 : 1;
    var trig = function(f){ return function(x){ var r = f(x * k); return Math.abs(r) < 1e-12 ? 0 : r; }; };
    var tanF = function(x){ var d = angleMode === 'deg' ? x : x * 180 / Math.PI; if (Math.abs(((d % 180) + 180) % 180 - 90) < 1e-9) return NaN; return trig(Math.tan)(x); };

    return { sin: trig(Math.sin), cos: trig(Math.cos), tan: tanF, asin: inv(Math.asin), acos: inv(Math.acos), atan: inv(Math.atan),
      sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh, asinh: Math.asinh, acosh: Math.acosh, atanh: Math.atanh,
      ln: Math.log, log: Math.log10, log2: Math.log2, sqrt: Math.sqrt, cbrt: Math.cbrt };
  }
  // n! for whole numbers, Γ(n+1) otherwise (as iPhone does).
  function factorial(n){
    if (n < 0 && Number.isInteger(n)) return NaN;
    if (Number.isInteger(n)) { if (n > 170) return Infinity; var r = 1; for (var i = 2; i <= n; i++) r *= i; return r; }

  function gamma(z){
    if (z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
    var g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059,
      12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];

    return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
  }
  function nthRoot(x, n){
    if (x < 0 && Number.isInteger(n) && Math.abs(n % 2) === 1) return -Math.pow(-x, 1 / n);
    return Math.pow(x, 1 / n);
  }

  function evaluate(expr){
    if (!expr) return null;

      var t = tokenize(expr), p = 0, FNS = makeFns();
      var peek = function(){ return t[p]; };
      var isOp = function(v){ var x = t[p]; return x && x.k === 'op' && x.v === v; };
      var parseExpr = function(){
        var v = parseTerm();
        while (isOp('+') || isOp('-')) { var o = t[p++].v, r = parseTerm(); v = o === '+' ? v + r : v - r; }
        return v;
      };
      var startsValue = function(x){ return x && (x.k === 'num' || x.k === '(' || x.k === 'fn'); };
      var parseTerm = function(){
        var v = parseUnary();
        for (;;) {
          if (isOp('*')) { p++; v *= parseUnary(); }
          else if (isOp('/')) { p++; v /= parseUnary(); }

          else return v;
        }
      };
      var parseUnary = function(){
        if (isOp('-')) { p++; return -parseUnary(); }
        if (isOp('+')) { p++; return parseUnary(); }
        return parsePower();
      };

        var base = parsePostfix();
        if (isOp('^')) { p++; return Math.pow(base, parseUnary()); }
        if (isOp('root')) { p++; return nthRoot(base, parseUnary()); }   // x ʸ√ y = y-th root of x
        return base;
      };

        var v = parsePrimary();
        while (t[p] && t[p].k === '!') { p++; v = factorial(v); }

      };

        var x = t[p++];

          if (t[p] && t[p].k === ')') p++;

      if (p < t.length) throw new Error('trailing');

      return val;
    }catch(e){ return null; }
  }

  // ---------- Display ----------
  function setResultText(text){
    text = (text === null || text === undefined || text === '') ? '0' : String(text);
    resultEl.textContent = text;
    fitResult();
  }

  // Shrink a number until it fits on one line (as iPhone does): one measurement, then scale.
  function fitText(el, max){
    el.style.fontSize = max + 'px';
    var over = el.scrollWidth, room = el.clientWidth;

  }
  function fitResult(){
    var key = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--key')) || 76;
    // Also fit the height left in the display (it is short in Scientific on small phones).
    var room = displayPanel.clientHeight - exprEl.offsetHeight - 12;
    // iPhone proportions: the answer is about 0.84 of the key width (~68pt on a 6.1" phone).
    var max = Math.min(80, key * 0.84, room > 0 ? room / 1.08 : 80);
    fitText(resultEl, Math.round(Math.max(28, max)));
  }

  function updateDisplay(){
    exprEl.textContent = justEvaluated && completedExpr ? prettify(completedExpr) : ' ';
    setResultText(prettify(display || '0'));
    updateClearLabel();
    // The operator just pressed stays lit until the next number, like iPhone.
    var pending = !justEvaluated && isOperator(lastChar()) ? lastChar() : '';
    document.querySelectorAll('.key[data-act="op"]').forEach(function(k){
      k.classList.toggle('operator-active', !!pending && k.getAttribute('data-val') === pending);
    });
  }

  // Top-left key: delete while there is something to delete, AC otherwise (iOS 18).
  var DELETE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 5H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.2a2 2 0 0 1-1.5-.7L2.5 12l5.2-6.3A2 2 0 0 1 9.2 5Z"/><path d="m11.5 9.5 5 5M16.5 9.5l-5 5"/></svg>';
  function clearLabel(){ return (!display || justEvaluated) ? 'AC' : 'DEL'; }
  var clearKey = null;
  function updateClearLabel(){                   // AC becomes C while a number is being typed (iOS 26)
    clearKey = clearKey || document.querySelector('.key[data-act="clear"]');
    if (!clearKey) return;
    var c = display && !justEvaluated;
    clearKey.textContent = c ? 'C' : 'AC';
    clearKey.setAttribute('aria-label', c ? 'Clear' : 'All clear');
  }

  function resetRepeat(){ repeatOp = null; repeatOperand = null; }

  function lastChar(){ return display.slice(-1); }
  // True when the display ends with something a number could follow by implicit ×.
  function endsWithValue(){ return /[0-9.)πe!]$/.test(display); }
  function endsWithClosedValue(){ return /[)πe!]$/.test(display); }

  // Called before any input: a result is either continued (operators) or replaced (new numbers).
  function beginInput(keepResult){
    if (justEvaluated) {
      if (!keepResult) { display = ''; carry = null; }

      justEvaluated = false;
      resetRepeat();
    }
  }

  function currentNumber(){
    var m = display.match(/(\d*\.?\d*(?:E[+−]?\d*)?)$/);
    return m ? m[1] : '';
  }

  // ---------- Keys ----------
  // After "result, √", typing a number means √ of that new number, not of the result.
  function takePendingFn(){
    if (pendingFn !== null) { display = pendingFn; pendingFn = null; carry = null; }
  }

  function handleDigit(d){
    takePendingFn();
    beginInput(false);
    if (endsWithClosedValue()) display += '×';
    var seg = currentNumber();
    if (seg === '0') {
      if (d === '0') { updateDisplay(); return; }
      display = display.slice(0, -1);
    }
    display += d;
    updateDisplay();
  }

  function handleDecimal(){
    takePendingFn();
    beginInput(false);
    if (currentNumber().indexOf('.') >= 0 || /E/.test(currentNumber())) { updateDisplay(); return; }
    if (endsWithClosedValue()) display += '×';
    display += /[0-9]$/.test(display) ? '.' : '0.';
    updateDisplay();
  }

  function handleOp(sym){
    pendingFn = null;
    beginInput(true);
    var last = lastChar();
    if (last === 'E') { if (sym === MINUS) { display += MINUS; updateDisplay(); } return; }
    if (last === MINUS && display.slice(-2, -1) === 'E') return;
    if (!display || last === '(') {
      if (sym === MINUS) display += MINUS;          // unary minus
      updateDisplay();
      return;
    }
    if (isOperator(last)) {
      var before = display.slice(0, -1);
      if (!before || before.slice(-1) === '(') {     // the operator there is a unary minus
        if (sym !== MINUS) display = before;
        updateDisplay();
        return;
      }
      if (last === '^' && sym === MINUS) {           // 2^−2: negative exponent
        display += MINUS;
        updateDisplay();
        return;
      }
      if (isOperator(before.slice(-1))) {            // "2^−" then + → "2+"
        display = before.slice(0, -1) + sym;
        updateDisplay();
        return;
      }
      display = before + sym;                        // swap one operator for another
      updateDisplay();
      return;
    }
    if (FN_RE.test(display)) return;
    display += sym;
    updateDisplay();
  }

  function openParen(){
    beginInput(false);
    if (endsWithValue()) display += '×';
    display += '(';
    updateDisplay();
  }
  function closeParen(){
    beginInput(true);
    var opens = (display.match(/\(/g) || []).length, closes = (display.match(/\)/g) || []).length;
    if (opens > closes && endsWithValue()) display += ')';
    updateDisplay();
  }
  // The single ( ) key closes when a bracket is open and a value was just entered, otherwise opens.
  function handleParen(){
    pendingFn = null;
    var opens = (display.match(/\(/g) || []).length, closes = (display.match(/\)/g) || []).length;
    if (!justEvaluated && opens > closes && endsWithValue()) closeParen();
    else openParen();
  }

  function handleFn(name){ handleUnary(name); }

  // ---------- Scientific keys (iPhone set) ----------
  // Function keys act on the number on screen (iPhone behaviour): 9 √x → √(9).
  // With nothing to act on, they start the function so you can type into it: √x 9 → √(9.
  var UNARY = {
    sq:    { wrap: function(t){ return t + '^2'; } },
    cube:  { wrap: function(t){ return t + '^3'; } },
    inv:   { wrap: function(t){ return '(1÷' + t + ')'; } },
    fact:  { wrap: function(t){ return t + '!'; } },
    exp:   { wrap: function(t){ return 'e^(' + t + ')'; }, prefix: 'e^(' },
    pow10: { wrap: function(t){ return '10^(' + t + ')'; }, prefix: '10^(' },
    pow2:  { wrap: function(t){ return '2^(' + t + ')'; }, prefix: '2^(' }
  };
  function unarySpec(name){
    if (UNARY[name]) return UNARY[name];
    return { wrap: function(t){ return name + '(' + t + ')'; }, prefix: name + '(' };   // sin, ln, sqrt…
  }

  function handleUnary(name){
    var spec = unarySpec(name);
    if (justEvaluated) {                              // apply to the result; typing a number instead starts fresh
      var res = display, keep = carry;
      beginInput(false);
      carry = keep;
      display = spec.wrap(res);
      pendingFn = spec.prefix || '';
      updateDisplay();
      return;

    if (start < 0) {

      return;

    if (head === MINUS) { head = ''; operand = MINUS + operand; }  // −5 √x is √(−5), as on iPhone

    takePendingFn();
    if (justEvaluated) { beginInput(true); }
    var seg = currentNumber();

    updateDisplay();
  }

  // Memory: mc clears, m+ / m− add or subtract the number on screen, mr recalls it.
  var memory = 0;
  try { memory = parseFloat(localStorage.getItem('calc_memory_v1')) || 0; } catch (e) {}
  function screenValue(){
    if (justEvaluated) return carry && carry.text === display ? carry.value : parseDisplayNum(display);
    var expr = display;
    while (expr && (isOperator(expr.slice(-1)) || /[(E]$/.test(expr))) expr = expr.slice(0, -1);
    return expr ? evaluate(expr) : 0;
  }
  function handleMemory(op){
    pendingFn = null;
    if (op === 'mc') memory = 0;
    else if (op === 'm+' || op === 'm-') {
      var v = screenValue();
      if (v === null || isNaN(v)) return;
      memory += op === 'm+' ? v : -v;
      if (Math.abs(memory) < 1e-14) memory = 0;
      // Like iPhone, the number is now "entered": the next digit starts a new number.
      completedExpr = justEvaluated ? completedExpr : '';
      display = fmtNum(v); carry = { text: display, value: v };
      justEvaluated = true; resetRepeat(); updateDisplay();
      showToast((op === 'm+' ? 'Added to' : 'Subtracted from') + ' memory');
    } else if (op === 'mr') {
      beginInput(false);
      if (endsWithValue()) display += '×';
      display += operandText(memory);
      updateDisplay();
    }
    try { localStorage.setItem('calc_memory_v1', String(memory)); } catch (e) {}
    updateMemoryKey();
  }
  function updateMemoryKey(){
    var mr = document.getElementById('memRecall');
    if (mr) mr.classList.toggle('mem-on', memory !== 0);
  }

  // Degrees by default, like iPhone. The key shows the mode you can switch to.
  var angleMode = 'deg';
  try { angleMode = localStorage.getItem('calc_angle_v1') === 'rad' ? 'rad' : 'deg'; } catch (e) {}
  function updateAngleKey(){
    var k = document.getElementById('angleKey'), badge = document.getElementById('angleBadge');
    if (k) { k.textContent = angleMode === 'deg' ? 'Rad' : 'Deg'; k.setAttribute('aria-label', angleMode === 'deg' ? 'Switch to radians' : 'Switch to degrees'); }
    if (badge) badge.hidden = !(angleMode === 'rad' && currentMode === 'sci');
  }
  function toggleAngle(){
    angleMode = angleMode === 'deg' ? 'rad' : 'deg';
    try { localStorage.setItem('calc_angle_v1', angleMode); } catch (e) {}
    updateAngleKey();
  }

  // 2nd swaps 10ˣ→2ˣ, log₁₀→log₂ and the trig keys for their inverses.
  var secondOn = false;
  function toggleSecond(){
    secondOn = !secondOn;
    document.getElementById('secondKey').classList.toggle('second-on', secondOn);
    document.querySelectorAll('#padSci .key[data-alt]').forEach(function(k){
      if (!k.hasAttribute('data-main')) { k.setAttribute('data-main', k.getAttribute('data-val')); k.setAttribute('data-main-label', k.innerHTML); }
      k.setAttribute('data-val', secondOn ? k.getAttribute('data-alt') : k.getAttribute('data-main'));
      k.innerHTML = secondOn ? k.getAttribute('data-alt-label') : k.getAttribute('data-main-label');
    });
  }

  function handleConst(name){
    takePendingFn();
    beginInput(false);
    if (endsWithValue()) display += '×';
    display += name === 'pi' ? 'π' : name === 'rand' ? fmtNum(Math.random()) : 'e';
    updateDisplay();
  }

  // Index where the trailing operand starts (number, constant, (−n) or a bracketed group), or -1.
  function trailingOperandStart(){
    if (!display) return -1;
    if (lastChar() === '!') {                        // 5! → the operand is 5!
      var saved = display; display = display.replace(/!+$/, '');
      var st = trailingOperandStart(); display = saved; return st;
    }
    if (lastChar() === ')') {
      var depth = 0;
      for (var i = display.length - 1; i >= 0; i--) {
        var ch = display.charAt(i);

        else if (ch === '(') { depth--; if (depth === 0) { var f = display.slice(0, i).match(new RegExp('(' + FN_NAMES + '|e\\^|10\\^|2\\^)$')); return f ? i - f[1].length : i; } }
      }

    }
    var m = display.match(/(\d*\.?\d+\.?(?:E[+−]?\d+)?|[πe])$/);
    if (m && /E[+−]?\d+$/.test(m[1]) === false && /E[+−]?$/.test(display)) return -1;
    return m ? display.length - m[1].length : -1;
  }

  function handleSign(){
    pendingFn = null;
    if (justEvaluated) {
      var v = parseDisplayNum(display);
      if (!isNaN(v)) {
        var full = carry && carry.text === display ? carry.value : v;
        display = fmtNum(-full); carry = { text: display, value: -full };
        completedExpr = ''; resetRepeat(); updateDisplay();
      }
      return;
    }
    if (!display) { display = MINUS; updateDisplay(); return; }
    if (display === MINUS) { display = ''; updateDisplay(); return; }
    var start = trailingOperandStart();
    if (start < 0) return;
    var operand = display.slice(start), head = display.slice(0, start);
    var neg = operand.match(/^\(−(.*)\)$/);
    if (neg && evaluate(operand) !== null && neg[1].indexOf('(') < 0) {
      display = head + neg[1];                       // (−5) → 5
    } else if (head === MINUS) {
      display = operand;                             // −5 → 5
    } else if (!head) {
      display = MINUS + operand;                     // 5 → −5
    } else {
      display = head + '(' + MINUS + operand + ')';  // 3×5 → 3×(−5)
    }
    updateDisplay();
  }

  // Last binary operator at bracket depth 0 (a minus right after an operator, '(' or E is unary).
  function findLastBinaryParts(expr){
    expr = expr === undefined ? display : expr;
    var depth = 0;
    for (var i = expr.length - 1; i > 0; i--) {
      var ch = expr.charAt(i);
      if (ch === ')') { depth++; continue; }
      if (ch === '(') { depth--; continue; }
      if (depth !== 0 || !isOperator(ch)) continue;
      if (!/[0-9.)πe!]/.test(expr.charAt(i - 1))) continue;
      var left = expr.slice(0, i), right = expr.slice(i + 1);
      if (left && right) return { left:left, op:ch, right:right };
    }
    return null;
  }

  function handlePercent(){
    pendingFn = null;
    if (justEvaluated) {
      var v = parseDisplayNum(display);
      if (isNaN(v)) return;
      if (carry && carry.text === display) v = carry.value;
      completedExpr = display + '%';
      display = fmtNum(v / 100);
      carry = { text: display, value: v / 100 };
      resetRepeat();
      updateDisplay();
      return;
    }
    if (!display || !endsWithValue()) return;
    var parts = findLastBinaryParts();
    if (!parts) {                                    // 50% → 0.5
      var whole = evaluate(display);
      if (whole !== null) { display = fmtNum(whole / 100); updateDisplay(); }
      return;
    }
    var leftVal = evaluate(parts.left), rightVal = evaluate(parts.right);
    if (leftVal === null || rightVal === null) return;
    // 100 + 10% → 100 + 10 ; 100 × 10% → 100 × 0.1
    var pct = (parts.op === '+' || parts.op === MINUS) ? leftVal * rightVal / 100 : rightVal / 100;
    display = parts.left + parts.op + operandText(pct);
    updateDisplay();
  }

  function operandText(v){ return v < 0 ? '(' + fmtNum(v) + ')' : fmtNum(v); }

  function handleBack(){
    pendingFn = null;
    if (justEvaluated) {                             // edit the result
      carry = null;
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
      if (/E|Error/.test(display)) display = '';
    }
    var fn = display.match(FN_RE);
    display = fn ? display.slice(0, -fn[0].length) : display.slice(0, -1);
    if (display === MINUS + '0' ) display = '';
    updateDisplay();
  }

  function handleClear(){
    pendingFn = null;
    display = '';
    carry = null;
    completedExpr = '';
    justEvaluated = false;
    resetRepeat();
    updateDisplay();
  }

  function handleEquals(){
    pendingFn = null;
    // Repeated equals: 5 + 2 = 7, = 9, = 11
    if (justEvaluated) {
      if (repeatOp === null) return;
      var current = carry && carry.text === display ? carry.value : parseDisplayNum(display);
      if (isNaN(current)) return;
      var repeatedExpr = operandText(current) + repeatOp + operandText(repeatOperand);
      var saved = carry; carry = null;
      var repeated = evaluate(repeatedExpr);
      carry = saved;
      if (repeated === null) { showError(repeatedExpr); return; }
      completedExpr = repeatedExpr;
      display = fmtNum(repeated);
      carry = { text: display, value: repeated };
      history.push({ expr: completedExpr, result: display });
      saveHistory(); renderHistory();
      updateDisplay();
      return;
    }
    if (!display) return;
    var expr = display;
    while (expr && (isOperator(expr.slice(-1)) || /[(E]$/.test(expr))) expr = expr.slice(0, -1);  // ignore a dangling operator / exponent
    if (!expr) return;
    var val = evaluate(expr);
    if (val === null) { showError(expr); return; }

    var parts = findLastBinaryParts(expr), rightVal = parts ? evaluate(parts.right) : null;
    if (parts && rightVal !== null) { repeatOp = parts.op; repeatOperand = rightVal; } else resetRepeat();

    var opens = (expr.match(/\(/g) || []).length, closes = (expr.match(/\)/g) || []).length;
    completedExpr = expr + new Array(Math.max(0, opens - closes) + 1).join(')');
    display = fmtNum(val);
    carry = { text: display, value: val };
    history.push({ expr: completedExpr, result: display });
    saveHistory(); renderHistory();
    justEvaluated = true;
    updateDisplay();
  }

  // Show Error with the failed sum above it; the next key starts a new calculation.
  function showError(expr){
    carry = null;
    completedExpr = expr;
    display = '';
    justEvaluated = true;
    resetRepeat();
    updateDisplay();
    setResultText('Error');
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function renderHistory(){
    if (!history.length){

      return '<div class="history-item" data-res="'+encodeURIComponent(h.result)+'">' +
        '<div class="h-expr">'+escapeHtml(prettify(h.expr))+' =</div>' +
        '<div class="h-res">'+escapeHtml(prettify(h.result))+'</div></div>';
    }).join('');
  }

  function bindPad(pad){
    pad.addEventListener('click', function(e){
      var btn = e.target.closest('button.key');
      if (!btn) return;

      var act = btn.getAttribute('data-act');
      var val = btn.getAttribute('data-val');

      switch(act){
        case 'digit': handleDigit(val); break;
        case 'op': handleOp(val); break;
        case 'decimal': handleDecimal(); break;
        case 'fn': handleFn(val); break;
        case 'unary': handleUnary(val); break;
        case 'const': handleConst(val); break;
        case 'paren': handleParen(); break;
        case 'open': pendingFn = null; openParen(); break;
        case 'close': pendingFn = null; closeParen(); break;
        case 'mem': handleMemory(val); break;
        case 'ee': handleEE(); break;
        case 'angle': toggleAngle(); break;
        case 'second': toggleSecond(); break;
        case 'sign': handleSign(); break;
        case 'percent': handlePercent(); break;
        case 'back': handleBack(); break;
        case 'clear': handleClear(); break;
        case 'equals': handleEquals(); break;
      }
    });
  }

  // Size the round keys so the keypad always fits between the display and the tab bar.
  function layout(){
    var root = document.documentElement, app = document.getElementById('calcApp');
    var cs = getComputedStyle(app);
    var width = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var height = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - document.querySelector('.topbar').offsetHeight;
    var gap = Math.round(Math.max(10, Math.min(16, width * 0.035)));
    var sci = currentMode === 'sci';
    var sgap = Math.round(gap * 0.55);
    var tight = height < 520;                        // e.g. iPhone SE in Safari
    var minDisplay = sci ? (tight ? 56 : 80) : 112;
    var sciRows = sci ? 5 : 0, sciMin = tight ? 27 : 36, sciMax = 46;
    var byWidth = (width - 3 * gap) / 4;
    // Basic keys get what is left once the scientific rows (half a key, never below a tap-able size) are placed.
    var avail = height - minDisplay - 5 * gap - (sci ? sciRows * sgap : 0);
    var key = Math.min(byWidth, avail / (5 + sciRows * 0.5), 92);
    var sciRow = Math.min(sciMax, Math.max(sciMin, key * 0.5));
    if (sci) key = Math.min(byWidth, (avail - sciRows * sciRow) / 5, 92);
    key = Math.floor(Math.max(tight && sci ? 30 : 34, key));
    root.style.setProperty('--key', key + 'px');
    root.style.setProperty('--gap', gap + 'px');
    root.style.setProperty('--sci-row', Math.floor(sciRow) + 'px');
    root.style.setProperty('--sgap', sgap + 'px');
    fitResult();
  }

  document.addEventListener('keydown', function(e){
    if (currentMode === 'convert' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var k = e.key;

    if (/^[0-9]$/.test(k)) { handleDigit(k); return; }
    if (k === '.' || k === ',') { handleDecimal(); return; }
    if (k === '+') { handleOp('+'); return; }
    if (k === '-') { handleOp(MINUS); return; }
    if (k === '*' || k === 'x' || k === 'X') { handleOp('×'); return; }
    if (k === '/') { e.preventDefault(); handleOp('÷'); return; }
    if (k === '^') { handleOp('^'); return; }
    if (k === '(') { openParen(); return; }
    if (k === ')') { closeParen(); return; }
    if (k === '%') { handlePercent(); return; }
    if (k === '!') { handleUnary('fact'); return; }
    if (k === 'Enter' || k === '=') { e.preventDefault(); handleEquals(); return; }
    if (k === 'Backspace') { handleBack(); return; }
    if (k === 'Escape' || k === 'Delete') { handleClear(); return; }

  function showToast(msg){

  function copyText(text){
    function done(){ showToast('Copied'); }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }

    function fallbackCopy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position='fixed';
        ta.style.left='-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e){}
    }
  }

  function bindLongPressCopy(el,getText){
    var timer;

    function start(){
      timer=setTimeout(function(){
        copyText(getText());
      },480);
    }

    function cancel(){
      clearTimeout(timer);
    }

    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',cancel);
    el.addEventListener('touchmove',cancel);
    el.addEventListener('mousedown',start);
    el.addEventListener('mouseup',cancel);
    el.addEventListener('mouseleave',cancel);
  }

  function convertTemp(v,from,to){

    else c=v-273.15;

    if(to==='c')return c;
    if(to==='f')return c*9/5+32;
    return c+273.15;

  document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});

  buildCatChips();
  populateSelects();
  updateConversion();
  loadHistory();
  var savedMode = 'basic';
  try { savedMode = localStorage.getItem('calc_mode_v5') || 'basic'; } catch (e) {}
  updateMemoryKey();
  updateAngleKey();
  var hashMode = location.hash.slice(1);
  if (/^(basic|sci|convert)$/.test(hashMode)) { savedMode = hashMode; window.history.replaceState(null, '', location.pathname); }
  setMode(/^(basic|sci|convert)$/.test(savedMode) ? savedMode : 'basic');
  window.addEventListener('hashchange', function(){
    var h = location.hash.slice(1);
    if (/^(basic|sci|convert)$/.test(h)) { setMode(h); window.history.replaceState(null, '', location.pathname); }
  });
  updateDisplay();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js").catch(function (error) {
      console.log("Service worker registration failed:", error);
    });

<script>
(function(){
  // Fast taps on the keypad: press on touchend without the browser's click delay,
  // but only if the finger lifts on the same key (sliding off cancels, like iOS).
  document.querySelectorAll('button.key').forEach(function(btn){
    btn.addEventListener('touchstart', function(){ btn.classList.add('pressed'); }, { passive:true });
    btn.addEventListener('touchcancel', function(){ btn.classList.remove('pressed'); });
    btn.addEventListener('touchend', function(e){
      btn.classList.remove('pressed');
      e.preventDefault();                       // stop the delayed synthetic click (no double press)
      var t = e.changedTouches[0];
      var under = t && document.elementFromPoint(t.clientX, t.clientY);
      if (under && btn.contains(under)) btn.click();
    }, { passive:false });
  });
})();
</script>
