<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<title>LifeCalc Ultimate</title>
<style>
  :root{
    --bg:#F5F1E7;
    --panel:#1B2340;
    --key:#FFFFFF;
    --key-border:#E4DFD1;
    --amber:#C9954B;
    --text:#1B2340;
    --text-dim:#928E80;
    --text-on-navy:#F5F1E7;
    --top-btn:#FFFFFF;
    --fn-bg:#FFFFFF;
    --op-bg:#1B2340;
    --op-text:#C9954B;
    --eq-bg:#C9954B;
    --eq-text:#FFFFFF;
    --shadow:rgba(27,35,64,.06);
  }

  body.dark{
    --bg:#000000;
    --panel:#000000;
    --key:#333333;
    --key-border:#4A4A4A;
    --amber:#FF9500;
    --text:#FFFFFF;
    --text-dim:#A5A5A5;
    --text-on-navy:#FFFFFF;
    --top-btn:#1C1C1E;
    --fn-bg:#A5A5A5;
    --op-bg:#FF9500;
    --op-text:#FFFFFF;
    --eq-bg:#FF9500;
    --eq-text:#FFFFFF;
    --shadow:transparent;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
  }

  button,input,select{ font:inherit; }

  .app{
    width:100%;
    max-width:480px;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      16px
      calc(env(safe-area-inset-bottom) + 8px);
    background:var(--bg);
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }

  .mode-toggle{
    display:flex;
    flex:1;
    min-width:0;
    background:var(--top-btn);
    border:1px solid var(--key-border);
    border-radius:999px;
    padding:4px;
  }

  .mode-toggle button{
    flex:1;
    min-width:0;
    border:0;
    background:transparent;
    color:var(--text-dim);
    border-radius:999px;
    padding:9px 6px;
    font-size:13px;
    font-weight:700;
  }

  .mode-toggle button.active{
    background:var(--panel);
    color:var(--text-on-navy);
  }

  body.dark .mode-toggle button.active{
    background:#FFFFFF;
    color:#000000;
  }

  .icon-btn,.history-btn,.theme-btn{
    width:44px;
    height:44px;
    flex:0 0 44px;
    border-radius:50%;
    border:1px solid var(--key-border);
    background:var(--top-btn);
    color:var(--text-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
  }

  .theme-btn{ font-size:18px; }

  .display{
    position:relative;
    flex:1 1 auto;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:12px 6px 10px;
    background:transparent;
    border-radius:0;
    margin:0;
    overflow:hidden;
  }

  .expr{
    min-height:28px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    color:var(--text-dim);
    text-align:right;
    font-size:21px;
    font-weight:400;
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
    letter-spacing:-.02em;
  }
  .expr::-webkit-scrollbar{display:none;}

  .result{
    margin-top:4px;
    min-height:76px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    color:var(--text);
    text-align:right;
    font-size:66px;
    font-weight:300;
    line-height:1;
    letter-spacing:-.045em;
    white-space:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
    user-select:text;
    -webkit-user-select:text;
  }
  body.dark .result{ color:#fff; }
  .result::-webkit-scrollbar{display:none;}
  .result.small{font-size:48px;}
  .result.tiny{font-size:35px;}

  .history-panel{
    position:absolute;
    inset:6px 0 8px;
    display:none;
    flex-direction:column;
    padding:18px 18px;
    border-radius:28px;
    background:var(--panel);
    color:var(--text-on-navy);
    z-index:10;
  }
  .history-panel.open{display:flex;}
  .history-panel h3{
    margin:0 0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    color:#9AA1C4;
  }
  .history-panel .clear{color:#E0937E;}
  .history-list{
    overflow:auto;
    display:flex;
    flex-direction:column-reverse;
    gap:4px;
  }
  .history-item{
    padding:10px 0;
    border-bottom:1px solid rgba(154,161,196,.18);
    text-align:right;
  }
  .history-item .h-expr{font-size:16px;color:#9AA1C4;}
  .history-item .h-res{font-size:28px;color:var(--text-on-navy);}
  .history-empty{margin-top:50px;text-align:center;color:#9AA1C4;}

  .toast{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%) translateY(8px);
    background:rgba(0,0,0,.78);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:8px 16px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:.18s ease;
    z-index:30;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .paste-overlay{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 60px);
    left:16px;
    right:16px;
    z-index:25;
    display:none;
  }
  .paste-overlay.open{display:block;}
  .paste-overlay input{
    width:100%;
    height:48px;
    border:1px solid var(--key-border);
    background:var(--top-btn);
    color:var(--text);
    border-radius:14px;
    padding:0 14px;
    font-size:17px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);
  }

  .pad{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
  }

  .pad.basic{
    grid-template-rows:repeat(5,minmax(66px,1fr));
    height:min(50vh,500px);
    margin-top:auto;
  }

  button.key{
    border:1px solid var(--key-border);
    border-radius:26px;
    background:var(--key);
    color:var(--text);
    font-size:34px;
    font-weight:400;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    box-shadow:0 1px 0 var(--shadow);
    transition:transform .04s ease,filter .06s ease;
  }

  button.key:active{
    transform:scale(.95);
    filter:brightness(.94);
  }

  .k-fn{
    background:var(--fn-bg)!important;
    color:var(--text)!important;
    font-size:28px!important;
  }

  body.dark .k-fn{
    color:#000!important;
    border-color:#A5A5A5!important;
  }

  .k-op{
    background:var(--op-bg)!important;
    color:var(--op-text)!important;
    border-color:var(--op-bg)!important;
    font-size:36px!important;
    font-weight:400!important;
  }

  .k-eq{
    background:var(--eq-bg)!important;
    color:var(--eq-text)!important;
    border-color:var(--eq-bg)!important;
    font-size:36px!important;
  }

  .k-wide{
    grid-column:span 2;
    justify-content:flex-start!important;
    padding-left:30px!important;
  }

  .pad.sci{
    grid-template-rows:repeat(7,minmax(46px,1fr));
    height:min(58vh,550px);
    gap:8px;
  }

  .pad.sci button.key{
    border-radius:20px;
    font-size:24px;
  }
  .pad.sci .k-sci{font-size:15px;}

  .convert-panel{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-top:14px;
  }

  .cat-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .cat-row::-webkit-scrollbar{display:none;}

  .cat-chip{
    flex:0 0 auto;
    border:1px solid var(--key-border);
    background:var(--top-btn);
    color:var(--text-dim);
    border-radius:999px;
    padding:9px 15px;
    font-weight:700;
  }
  .cat-chip.active{
    background:var(--panel);
    color:var(--text-on-navy);
  }
  body.dark .cat-chip.active{
    background:#fff;
    color:#000;
  }

  .conv-card{
    background:var(--top-btn);
    border:1px solid var(--key-border);
    border-radius:22px;
    padding:15px 17px;
  }
  .conv-card label{
    display:block;
    margin-bottom:5px;
    color:var(--text-dim);
    font-size:12px;
    font-weight:700;
  }
  .conv-card select{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    font-size:16px;
    font-weight:700;
  }
  .conv-value{
    width:100%;
    margin-top:10px;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    font-size:36px;
    font-weight:400;
  }
  .swap-row{display:flex;justify-content:center;margin:-2px 0;}
  .swap-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:var(--amber);
    color:white;
    font-size:20px;
  }
  .conv-result{
    margin-top:auto;
    background:var(--panel);
    border-radius:26px;
    padding:18px;
  }
  body.dark .conv-result{background:#1C1C1E;}
  .conv-result .r-unit{color:#9AA1C4;font-size:13px;font-weight:700;}
  .conv-result .r-value{
    margin-top:3px;
    color:var(--text-on-navy);
    font-size:42px;
    font-weight:400;
    word-break:break-all;
  }

  @media (max-height:740px){
    .app{
      padding-top:calc(env(safe-area-inset-top) + 6px);
      padding-bottom:calc(env(safe-area-inset-bottom) + 8px);
    }
    .icon-btn,.history-btn,.theme-btn{width:40px;height:40px;flex-basis:40px;}
    .mode-toggle button{padding:7px 5px;}
    .display{min-height:165px;padding-bottom:8px;}
    .expr{font-size:21px;}
    .result{font-size:56px;min-height:60px;}
    .result.small{font-size:45px;}
    .result.tiny{font-size:35px;}
    .pad.basic{height:min(51vh,440px);gap:8px;}
    button.key{border-radius:24px;font-size:29px;}
    .k-fn{font-size:24px!important;}
    .k-op,.k-eq{font-size:32px!important;}
  }

  @media (min-width:430px) and (min-height:820px){
    .display{min-height:245px;}
    .pad.basic{height:500px;}
    button.key{border-radius:28px;}
    .result{font-size:74px;}
  }

  @media (min-height:900px){
    .display{min-height:290px;}
    .pad.basic{height:500px;}
  }


  button.key.operator-active{
    background:var(--text-on-navy)!important;
    color:var(--panel)!important;
  }
  body.dark button.key.operator-active{
    background:#FFFFFF!important;
    color:#FF9500!important;
  }


<style>

</head>
<body>
<div class="app">
  
<div class="lc-nav">
<button data-lc="calc">🧮 Calc</button>

</div>
<div class="topbar">
    <button class="history-btn" id="historyBtn" aria-label="History">&#8635;</button>

  <div class="display" id="displayPanel">
    <div class="expr" id="exprEl">&nbsp;</div>
    <div class="result" id="resultEl">0</div>
    <div class="toast" id="toastEl">Copied</div>

    <div class="history-panel" id="historyPanel">
      <h3>History <span class="clear" id="clearHistory">Clear</span></h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <div class="pad basic" id="padBasic">
    <button class="key k-fn" data-act="clear">AC</button>
    <button class="key k-fn" data-act="sign">&plusmn;</button>
    <button class="key k-fn" data-act="percent">%</button>
    <button class="key k-op" data-act="op" data-val="&divide;">&divide;</button>

    <button class="key" data-act="digit" data-val="7">7</button>
    <button class="key" data-act="digit" data-val="8">8</button>
    <button class="key" data-act="digit" data-val="9">9</button>
    <button class="key k-op" data-act="op" data-val="&times;">&times;</button>

    <button class="key" data-act="digit" data-val="4">4</button>
    <button class="key" data-act="digit" data-val="5">5</button>
    <button class="key" data-act="digit" data-val="6">6</button>
    <button class="key k-op" data-act="op" data-val="&minus;">&minus;</button>

    <button class="key" data-act="digit" data-val="1">1</button>
    <button class="key" data-act="digit" data-val="2">2</button>
    <button class="key" data-act="digit" data-val="3">3</button>

    <button class="key k-op" data-act="op" data-val="&divide;">&divide;</button>

    <button class="key" data-act="digit" data-val="7">7</button>
    <button class="key" data-act="digit" data-val="8">8</button>
    <button class="key" data-act="digit" data-val="9">9</button>
    <button class="key k-op" data-act="op" data-val="&times;">&times;</button>

    <button class="key" data-act="digit" data-val="4">4</button>
    <button class="key" data-act="digit" data-val="5">5</button>
    <button class="key" data-act="digit" data-val="6">6</button>
    <button class="key k-op" data-act="op" data-val="&minus;">&minus;</button>

    <button class="key" data-act="digit" data-val="1">1</button>
    <button class="key" data-act="digit" data-val="2">2</button>
    <button class="key" data-act="digit" data-val="3">3</button>
    <button class="key k-op" data-act="op" data-val="+">+</button>

    <button class="key" data-act="paren" data-val="(">(</button>
    <button class="key" data-act="digit" data-val="0">0</button>
    <button class="key" data-act="decimal">.</button>
    <button class="key k-eq" data-act="equals">=</button>
  </div>

  <div class="convert-panel" id="padConvert" style="display:none;">
    <div class="cat-row" id="catRow"></div>

    <div class="conv-card">
      <label>From</label>
      <select id="fromSelect"></select>
      <input type="text" class="conv-value" id="convValueInput" inputmode="decimal" value="1">
    </div>

    <div class="swap-row">
      <button class="swap-btn" id="swapBtn" aria-label="Swap units">&#8645;</button>
    </div>

    <div class="conv-card">
      <label>To</label>
      <select id="toSelect"></select>
    </div>

    <div class="conv-result" id="convResult">
      <div class="r-unit" id="convResultUnit">&nbsp;</div>
      <div class="r-value" id="convResultValue">0</div>
    </div>
  </div>
</div>

<script>
(function(){
  var exprEl = document.getElementById('exprEl');
  var resultEl = document.getElementById('resultEl');
  var historyPanel = document.getElementById('historyPanel');
  var historyList = document.getElementById('historyList');
  var historyBtn = document.getElementById('historyBtn');
  var clearHistoryBtn = document.getElementById('clearHistory');
  var padBasic = document.getElementById('padBasic');
  var padSci = document.getElementById('padSci');
  var padConvert = document.getElementById('padConvert');
  var displayPanel = document.getElementById('displayPanel');
  var modeBasic = document.getElementById('modeBasic');
  var modeSci = document.getElementById('modeSci');
  var modeConvert = document.getElementById('modeConvert');
  var toastEl = document.getElementById('toastEl');
  var pasteBtn = document.getElementById('pasteBtn');
  var pasteOverlay = document.getElementById('pasteOverlay');
  var pasteInput = document.getElementById('pasteInput');

  var display = '';
  var completedExpr = '';
  var justEvaluated = false;
  var history = [];
  var currentMode = 'basic';
  var repeatOp = null;
  var repeatOperand = null;

  var OP_MAP = { '\u00F7':'/', '\u00D7':'*', '\u2212':'-', '+':'+', '^':'**' };
  var OPERATORS = '\u00F7\u00D7\u2212+^';

  function loadHistory(){
    try{
      var s = localStorage.getItem('calc_history_v4');
      if (!s) s = localStorage.getItem('calc_history_v1');
      history = s ? JSON.parse(s) : [];
    }catch(e){ history = []; }
    renderHistory();
  }

  function saveHistory(){
    try{ localStorage.setItem('calc_history_v4', JSON.stringify(history.slice(-30))); }catch(e){}
  }

  function fmtNum(n){
    if (!isFinite(n)) return 'Error';
    if (Math.abs(n) < 1e-12) n = 0;
    var abs = Math.abs(n);
    var s;
    if ((abs >= 1e12) || (abs > 0 && abs < 1e-9)) {
      s = n.toExponential(8).replace(/\.?0+e/, 'e');
    } else {
      s = Number(n.toPrecision(12)).toString();
    }
    return s;
  }

  function rawify(disp){
    var s = disp;
    Object.keys(OP_MAP).forEach(function(k){ s = s.split(k).join(OP_MAP[k]); });
    return s;
  }

  function evaluate(expr){
    if (!expr) return null;
    try{
      var cleaned = expr
        .replace(/\u03C0/g, 'Math.PI')
        .replace(/\be\b/g, 'Math.E')
        .replace(/sqrt\(/g, 'Math.sqrt(')
        .replace(/sin\(/g, 'Math.sin(')
        .replace(/cos\(/g, 'Math.cos(')
        .replace(/tan\(/g, 'Math.tan(')
        .replace(/ln\(/g, 'Math.log(')
        .replace(/log\(/g, 'Math.log10(');

      // Do not auto-evaluate if the expression visibly ends with an operator.
      if (/[+\-*/]$/.test(cleaned) || cleaned.endsWith('**')) return null;

      var openCount = (cleaned.match(/\(/g)||[]).length;
      var closeCount = (cleaned.match(/\)/g)||[]).length;
      for (var i=0;i<openCount-closeCount;i++) cleaned += ')';

      var val = Function('"use strict"; return (' + cleaned + ')')();
      if (typeof val !== 'number' || isNaN(val) || !isFinite(val)) return null;
      return val;
    }catch(e){ return null; }
  }

  function setResultText(text){
    text = (text === null || text === undefined || text === '') ? '0' : String(text);
    resultEl.textContent = text;
    resultEl.classList.toggle('small', text.length > 8);
    resultEl.classList.toggle('tiny', text.length > 12);
  }

  function updateDisplay(){
    if (justEvaluated) {
      exprEl.textContent = completedExpr ? completedExpr + ' =' : '\u00A0';
      setResultText(display || '0');
      updateClearLabel();
      return;
    }

    // iPhone-style behaviour: show the CALCULATION while entering it.
    exprEl.textContent = '\u00A0';
    setResultText(display || '0');
    updateClearLabel();
  }

  function updateClearLabel(){
    var clearButtons = document.querySelectorAll('[data-act="clear"]');
    var label = (!display || (justEvaluated && display === '0')) ? 'AC' : 'C';
    clearButtons.forEach(function(btn){ btn.textContent = label; });
  }

  function resetRepeat(){
    repeatOp = null;
    repeatOperand = null;
  }

  function append(token){
    if (justEvaluated){
      // Digits/constants/functions start a new calculation.
      var startsFresh = /^[0-9.(]/.test(token) || token === '\u03C0' || token === 'e' ||
                        /^[a-z]/i.test(token);
      if (startsFresh) {
        display = '';
        completedExpr = '';
        resetRepeat();
      }
      justEvaluated = false;
    }
    display += token;
    updateDisplay();
  }

  function handleDigit(d){
    if (justEvaluated) {
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
    }

    // Prevent absurd leading zero strings like 00005.
    var seg = getCurrentNumberSegment();
    if (seg === '0' && d === '0') return;
    if (seg === '0' && d !== '0') {
      display = display.slice(0, -1) + d;
    } else {
      display += d;
    }
    updateDisplay();
  }

  function handleOp(sym){
    if (!display.length) {
      if (sym === '\u2212') {
        display = sym;
        justEvaluated = false;
        updateDisplay();
      }
      return;
    }

    if (justEvaluated) {
      justEvaluated = false;
      completedExpr = '';
    }

    var last = display.slice(-1);
    if (OPERATORS.includes(last)) {
      display = display.slice(0, -1) + sym;
      updateDisplay();
      return;
    }

    if (last === '(' && sym !== '\u2212') return;

    display += sym;
    updateDisplay();
  }

  function getCurrentNumberSegment(){
    var m = display.match(/(?:^|[\u00F7\u00D7\u2212+^()])(-?\d*\.?\d*)$/);
    if (!m) return '';
    return m[1] || '';
  }

  function handleDecimal(){
    if (justEvaluated) {
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
    }
    var current = getCurrentNumberSegment();
    if (current.includes('.')) return;
    if (!display.length || OPERATORS.includes(display.slice(-1)) || display.slice(-1) === '(') {
      display += '0.';
    } else {
      display += '.';
    }
    updateDisplay();
  }

  function handleFn(name){
    if (justEvaluated) {
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
    }
    display += name + '(';
    updateDisplay();
  }

  function handleConst(name){
    if (justEvaluated) {
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
    }
    display += name === 'pi' ? '\u03C0' : 'e';
    updateDisplay();
  }

  function handleParen(){
    if (justEvaluated) {
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
    }
    var opens = (display.match(/\(/g)||[]).length;
    var closes = (display.match(/\)/g)||[]).length;
    var last = display.slice(-1);

    if (opens > closes && /[0-9)\u03C0e]/.test(last)) {
      display += ')';
    } else {
      if (/[0-9)\u03C0e]/.test(last)) display += '\u00D7';
      display += '(';
    }
    updateDisplay();
  }

  function handleSign(){
    if (!display.length) return;

    if (justEvaluated) {
      var val = parseFloat(display);
      if (!isNaN(val)) {
        display = fmtNum(-val);
        completedExpr = '';
        justEvaluated = true;
        resetRepeat();
        updateDisplay();
      }
      return;
    }

    // Toggle the current trailing numeric operand.
    var m = display.match(/(-?\d+(?:\.\d+)?)$/);
    if (!m) return;

    var num = m[1];
    var start = display.length - num.length;

    if (num.charAt(0) === '-') {
      display = display.slice(0, start) + num.slice(1);
    } else {
      // Use parentheses to keep maths valid when negating an operand after another operator.
      display = display.slice(0, start) + '(-' + num + ')';
    }
    updateDisplay();
  }

  function findLastBinaryParts(){
    // Supports the common calculator case: left-expression OP numeric-right-operand.
    // Finds the last visible binary operator, ignoring a leading minus.
    var depth = 0;
    for (var i = display.length - 1; i >= 0; i--) {
      var ch = display[i];
      if (ch === ')') { depth++; continue; }
      if (ch === '(') { depth--; continue; }
      if (depth !== 0) continue;
      if (OPERATORS.includes(ch)) {
        if (i === 0 && ch === '\u2212') continue;
        var left = display.slice(0, i);
        var right = display.slice(i + 1);
        if (left && right) return {left:left, op:ch, right:right, index:i};
      }
    }
    return null;
  }

  function handlePercent(){
    if (!display.length || justEvaluated) {
      var solo = parseFloat(display);
      if (!isNaN(solo)) {
        display = fmtNum(solo / 100);
        completedExpr = '';
        justEvaluated = false;
        updateDisplay();
      }
      return;
    }

    var parts = findLastBinaryParts();

    // Single number: 50% -> 0.5
    if (!parts) {
      var val = evaluate(rawify(display));
      if (val !== null) {
        display = fmtNum(val / 100);
        updateDisplay();
      }
      return;
    }

    var leftVal = evaluate(rawify(parts.left));
    var rightVal = evaluate(rawify(parts.right));
    if (leftVal === null || rightVal === null) return;

    var pctValue;
    if (parts.op === '+' || parts.op === '\u2212') {
      // 100 + 10% -> 100 + 10
      pctValue = leftVal * rightVal / 100;
    } else {
      // 100 × 10% -> 100 × 0.1 ; 100 ÷ 10% -> 100 ÷ 0.1
      pctValue = rightVal / 100;
    }

    display = parts.left + parts.op + fmtNum(pctValue);
    updateDisplay();
  }

  function handleBack(){
    if (justEvaluated){
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
      updateDisplay();
      return;
    }
    display = display.slice(0, -1);
    updateDisplay();
  }

  function handleClear(){
    display = '';
    completedExpr = '';
    justEvaluated = false;
    resetRepeat();
    updateDisplay();
  }

  function handleClearEntry(){
    if (!display.length) return;
    if (justEvaluated){
      display = '';
      completedExpr = '';
      justEvaluated = false;
      resetRepeat();
      updateDisplay();
      return;
    }

    display = display.replace(/\d*\.?\d+\)?$/, '');
    updateDisplay();
  }

  function captureRepeatOperation(expr){
    var oldDisplay = display;
    display = expr;
    var parts = findLastBinaryParts();
    display = oldDisplay;

    if (!parts) {
      resetRepeat();
      return;
    }

    var rightVal = evaluate(rawify(parts.right));
    if (rightVal === null) {
      resetRepeat();
      return;
    }

    repeatOp = parts.op;
    repeatOperand = rightVal;
  }

  function handleEquals(){
    // Repeated equals: 5 + 2 = 7, = 9, = 11
    if (justEvaluated && repeatOp !== null && repeatOperand !== null) {
      var current = parseFloat(display);
      if (isNaN(current)) return;
      var repeatedExpr = fmtNum(current) + repeatOp + fmtNum(repeatOperand);
      var repeatedVal = evaluate(rawify(repeatedExpr));
      if (repeatedVal === null) return;

      completedExpr = repeatedExpr;
      display = fmtNum(repeatedVal);
      history.push({expr:completedExpr, result:display});
      saveHistory();
      renderHistory();
      justEvaluated = true;
      updateDisplay();
      return;
    }

    if (!display.length) return;

    // Ignore equals if expression ends with an operator.
    if (OPERATORS.includes(display.slice(-1))) return;

    var expr = display;
    var val = evaluate(rawify(expr));
    if (val === null) {
      setResultText('Error');
      return;
    }

    captureRepeatOperation(expr);

    completedExpr = expr;
    display = fmtNum(val);
    history.push({expr:completedExpr, result:display});
    saveHistory();
    renderHistory();

    justEvaluated = true;
    updateDisplay();
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function renderHistory(){
    if (!history.length){
      historyList.innerHTML = '<div class="history-empty">No calculations yet</div>';
      return;
    }

    historyList.innerHTML = history.slice(-30).map(function(h){
      return '<div class="history-item" data-res="'+encodeURIComponent(h.result)+'">' +
        '<div class="h-expr">'+escapeHtml(h.expr)+' =</div>' +
        '<div class="h-res">'+escapeHtml(h.result)+'</div></div>';
    }).join('');
  }

  historyList.addEventListener('click', function(e){
    var item = e.target.closest('.history-item');
    if (!item) return;
    display = decodeURIComponent(item.getAttribute('data-res'));
    completedExpr = '';
    justEvaluated = true;
    resetRepeat();
    updateDisplay();
    historyPanel.classList.remove('open');
  });

  clearHistoryBtn.addEventListener('click', function(){
    history = [];
    saveHistory();
    renderHistory();
  });

  historyBtn.addEventListener('click', function(){
    historyPanel.classList.toggle('open');
  });

  function bindPad(pad){
    pad.addEventListener('click', function(e){
      var btn = e.target.closest('button.key');
      if (!btn) return;

      var act = btn.getAttribute('data-act');
      var val = btn.getAttribute('data-val');

      switch(act){
        case 'digit': handleDigit(val); break;
        case 'op': handleOp(val); break;
        case 'decimal': handleDecimal(); break;
        case 'fn': handleFn(val); break;
        case 'const': handleConst(val); break;
        case 'paren': handleParen(); break;
        case 'sign': handleSign(); break;
        case 'percent': handlePercent(); break;
        case 'back': handleBack(); break;
        case 'clear': if (btn.textContent === 'C') { handleClearEntry(); } else { handleClear(); } break;
        case 'equals': handleEquals(); break;
      }
    });
  }

  bindPad(padBasic);
  bindPad(padSci);

  function setMode(mode){
    currentMode = mode;
    modeBasic.classList.toggle('active', mode==='basic');
    modeSci.classList.toggle('active', mode==='sci');
    modeConvert.classList.toggle('active', mode==='convert');

    padBasic.style.display = mode==='basic' ? 'grid' : 'none';
    padSci.style.display = mode==='sci' ? 'grid' : 'none';
    padConvert.style.display = mode==='convert' ? 'flex' : 'none';
    displayPanel.style.display = mode==='convert' ? 'none' : 'flex';
  }

  modeBasic.addEventListener('click', function(){ setMode('basic'); });
  modeSci.addEventListener('click', function(){ setMode('sci'); });
  modeConvert.addEventListener('click', function(){ setMode('convert'); });

  document.addEventListener('keydown', function(e){
    if (currentMode === 'convert') return;
    var k = e.key;

    if (/^[0-9]$/.test(k)) { handleDigit(k); return; }
    if (k === '.') { handleDecimal(); return; }
    if (k === '+') { handleOp('+'); return; }
    if (k === '-') { handleOp('\u2212'); return; }
    if (k === '*') { handleOp('\u00D7'); return; }
    if (k === '/') { e.preventDefault(); handleOp('\u00F7'); return; }
    if (k === '^') { handleOp('^'); return; }
    if (k === '(' || k === ')') { handleParen(); return; }
    if (k === '%') { handlePercent(); return; }
    if (k === 'Enter' || k === '=') { e.preventDefault(); handleEquals(); return; }
    if (k === 'Backspace') { handleBack(); return; }
    if (k === 'Escape') { handleClear(); return; }
  });

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      toastEl.classList.remove('show');
    },1200);
  }

  function copyText(text){
    function done(){ showToast('Copied'); }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }

    function fallbackCopy(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position='fixed';
        ta.style.left='-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      }catch(e){}
    }
  }

  function bindLongPressCopy(el,getText){
    var timer;

    function start(){
      timer=setTimeout(function(){
        copyText(getText());
      },480);
    }

    function cancel(){
      clearTimeout(timer);
    }

    el.addEventListener('touchstart',start,{passive:true});
    el.addEventListener('touchend',cancel);
    el.addEventListener('touchmove',cancel);
    el.addEventListener('mousedown',start);
    el.addEventListener('mouseup',cancel);
    el.addEventListener('mouseleave',cancel);
  }

  bindLongPressCopy(resultEl,function(){
    return resultEl.textContent;
  });

  var pasteTarget='calc';

  if (pasteBtn) {
    pasteBtn.addEventListener('click',function(){
      pasteTarget=currentMode==='convert'?'convert':'calc';
      pasteOverlay.classList.add('open');
      pasteInput.value='';
      pasteInput.focus();
    });
  }

  pasteInput.addEventListener('input',function(){
    var v=pasteInput.value.trim();
    var num=parseFloat(v.replace(/,/g,''));

    if (!isNaN(num)){
      if (pasteTarget==='convert'){
        convValueInput.value=num.toString();
        updateConversion();
      }else{
        display=num.toString();
        completedExpr='';
        justEvaluated=false;
        resetRepeat();
        updateDisplay();
      }

      pasteOverlay.classList.remove('open');
      pasteInput.blur();
      showToast('Pasted');
    }
  });

  pasteInput.addEventListener('blur',function(){
    setTimeout(function(){
      pasteOverlay.classList.remove('open');
    },150);
  });

  var CATEGORIES={
    length:{label:'Length',units:[
      {key:'mm',label:'Millimetres',abbr:'mm',factor:0.001},
      {key:'cm',label:'Centimetres',abbr:'cm',factor:0.01},
      {key:'m',label:'Metres',abbr:'m',factor:1},
      {key:'km',label:'Kilometres',abbr:'km',factor:1000},
      {key:'in',label:'Inches',abbr:'in',factor:0.0254},
      {key:'ft',label:'Feet',abbr:'ft',factor:0.3048},
      {key:'yd',label:'Yards',abbr:'yd',factor:0.9144},
      {key:'mi',label:'Miles',abbr:'mi',factor:1609.344}
    ],defaultFrom:'km',defaultTo:'mi'},

    weight:{label:'Weight',units:[
      {key:'mg',label:'Milligrams',abbr:'mg',factor:0.000001},
      {key:'g',label:'Grams',abbr:'g',factor:0.001},
      {key:'kg',label:'Kilograms',abbr:'kg',factor:1},
      {key:'oz',label:'Ounces',abbr:'oz',factor:0.028349523125},
      {key:'lb',label:'Pounds',abbr:'lb',factor:0.45359237},
      {key:'st',label:'Stone',abbr:'st',factor:6.35029318},
      {key:'t',label:'Tonnes',abbr:'t',factor:1000}
    ],defaultFrom:'kg',defaultTo:'lb'},

    temp:{label:'Temperature',units:[
      {key:'c',label:'Celsius',abbr:'\u00B0C'},
      {key:'f',label:'Fahrenheit',abbr:'\u00B0F'},
      {key:'k',label:'Kelvin',abbr:'K'}
    ],defaultFrom:'c',defaultTo:'f'},

    volume:{label:'Volume',units:[
      {key:'ml',label:'Millilitres',abbr:'mL',factor:0.001},
      {key:'l',label:'Litres',abbr:'L',factor:1},
      {key:'m3',label:'Cubic metres',abbr:'m\u00B3',factor:1000},
      {key:'tsp',label:'Teaspoons',abbr:'tsp',factor:0.005},
      {key:'tbsp',label:'Tablespoons (AU)',abbr:'tbsp',factor:0.02},
      {key:'floz',label:'Fluid ounces (US)',abbr:'fl oz',factor:0.0295735295625},
      {key:'cup',label:'Cups (AU)',abbr:'cup',factor:0.25},
      {key:'pt',label:'Pints (US)',abbr:'pt',factor:0.473176473},
      {key:'qt',label:'Quarts (US)',abbr:'qt',factor:0.946352946},
      {key:'gal',label:'Gallons (US)',abbr:'gal',factor:3.785411784}
    ],defaultFrom:'l',defaultTo:'gal'},

    area:{label:'Area',units:[
      {key:'m2',label:'Square metres',abbr:'m\u00B2',factor:1},
      {key:'km2',label:'Square kilometres',abbr:'km\u00B2',factor:1000000},
      {key:'ft2',label:'Square feet',abbr:'ft\u00B2',factor:0.09290304},
      {key:'yd2',label:'Square yards',abbr:'yd\u00B2',factor:0.83612736},
      {key:'acre',label:'Acres',abbr:'ac',factor:4046.8564224},
      {key:'ha',label:'Hectares',abbr:'ha',factor:10000},
      {key:'mi2',label:'Square miles',abbr:'mi\u00B2',factor:2589988.110336}
    ],defaultFrom:'m2',defaultTo:'ft2'}
  };

  var CAT_ORDER=['length','weight','temp','volume','area'];
  var currentCat='length',currentFromUnit,currentToUnit;

  var catRow=document.getElementById('catRow');
  var fromSelect=document.getElementById('fromSelect');
  var toSelect=document.getElementById('toSelect');
  var convValueInput=document.getElementById('convValueInput');
  var swapBtn=document.getElementById('swapBtn');
  var convResultValue=document.getElementById('convResultValue');
  var convResultUnit=document.getElementById('convResultUnit');

  function buildCatChips(){
    catRow.innerHTML=CAT_ORDER.map(function(key){
      var c=CATEGORIES[key];
      return '<button class="cat-chip'+(key===currentCat?' active':'')+'" data-cat="'+key+'">'+c.label+'</button>';
    }).join('');
  }

  catRow.addEventListener('click',function(e){
    var chip=e.target.closest('.cat-chip');
    if(!chip)return;

    currentCat=chip.getAttribute('data-cat');
    buildCatChips();
    populateSelects();
    updateConversion();
  });

  function populateSelects(){
    var cat=CATEGORIES[currentCat];
    var opts=cat.units.map(function(u){
      return '<option value="'+u.key+'">'+u.label+'</option>';
    }).join('');

    fromSelect.innerHTML=opts;
    toSelect.innerHTML=opts;
    fromSelect.value=currentFromUnit=cat.defaultFrom;
    toSelect.value=currentToUnit=cat.defaultTo;
  }

  fromSelect.addEventListener('change',function(){
    currentFromUnit=fromSelect.value;
    updateConversion();
  });

  toSelect.addEventListener('change',function(){
    currentToUnit=toSelect.value;
    updateConversion();
  });

  convValueInput.addEventListener('input',updateConversion);

  swapBtn.addEventListener('click',function(){
    var tmp=currentFromUnit;
    currentFromUnit=currentToUnit;
    currentToUnit=tmp;
    fromSelect.value=currentFromUnit;
    toSelect.value=currentToUnit;
    updateConversion();
  });

  function unitAbbr(catKey,unitKey){
    var u=CATEGORIES[catKey].units.filter(function(x){
      return x.key===unitKey;
    })[0];
    return u?u.abbr:'';
  }

  function convertTemp(v,from,to){
    var c;
    if(from==='c')c=v;
    else if(from==='f')c=(v-32)*5/9;
    else c=v-273.15;

    if(to==='c')return c;
    if(to==='f')return c*9/5+32;
    return c+273.15;
  }

  function convertVal(value,fromKey,toKey,catKey){
    if(catKey==='temp')return convertTemp(value,fromKey,toKey);

    var cat=CATEGORIES[catKey];
    var fromU=cat.units.filter(function(u){return u.key===fromKey;})[0];
    var toU=cat.units.filter(function(u){return u.key===toKey;})[0];

    return(value*fromU.factor)/toU.factor;
  }

  function updateConversion(){
    var val=parseFloat(convValueInput.value);

    if(isNaN(val)){
      convResultValue.textContent='0';
      convResultUnit.textContent=unitAbbr(currentCat,currentToUnit);
      return;
    }

    var result=convertVal(val,currentFromUnit,currentToUnit,currentCat);
    convResultValue.textContent=fmtNum(result);
    convResultUnit.textContent=unitAbbr(currentCat,currentToUnit);
  }

  bindLongPressCopy(convResultValue,function(){
    return convResultValue.textContent;
  });

  // Theme
  var themeBtn=document.getElementById('themeBtn');

  function applyTheme(theme){
    document.body.classList.toggle('dark',theme==='dark');
    if(themeBtn)themeBtn.innerHTML=theme==='dark'?'&#9788;':'&#9790;';
    try{localStorage.setItem('calc_theme_v4',theme);}catch(e){}
  }

  var savedTheme='light';
  try{
    savedTheme=localStorage.getItem('calc_theme_v4') ||
               localStorage.getItem('calc_theme_v2') ||
               'light';
  }catch(e){}

  applyTheme(savedTheme);

  if(themeBtn){
    themeBtn.addEventListener('click',function(){
      applyTheme(document.body.classList.contains('dark')?'light':'dark');
    });
  }

  // Prevent accidental iPhone zoom without interfering with normal single taps.
  var lastTouchEnd=0;

  document.addEventListener('touchend',function(e){
    var now=Date.now();
    if(now-lastTouchEnd<=280)e.preventDefault();
    lastTouchEnd=now;
  },{passive:false});

  document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gestureend',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});

  buildCatChips();
  populateSelects();
  updateConversion();
  loadHistory();
  updateDisplay();
})();
</script>

<script>
(function(){

  document.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('touchstart', function(){
      btn.style.transform='scale(.96)';
    }, {passive:true});
    btn.addEventListener('touchend', function(){
      btn.style.transform='';
    }, {passive:true});
  });

  // Avoid iOS delayed click behaviour on calculator keys.
  document.querySelectorAll('button.key').forEach(function(btn){

<div class="lc-section" id="moneySection">
<div class="lc-card">
<h3>Budget Planner</h3>
<input class="lc-input" id="lcItem" placeholder="Expense name">
<input class="lc-input" id="lcAmount" placeholder="Amount" inputmode="decimal">
<button class="lc-action" id="lcAdd">Add Expense</button>
</div>
<div class="lc-card" id="lcList">No items yet</div>
</div>

<div class="lc-section" id="financeSection">
<div class="lc-card">
<h3>Repayment Calculator</h3>
<input class="lc-input" id="loanAmount" placeholder="Loan amount">
<input class="lc-input" id="loanRate" placeholder="Interest %">
<input class="lc-input" id="loanYears" placeholder="Years">
<button class="lc-action" id="loanCalc">Calculate</button>
<div id="loanResult"></div>
</div>
</div>

<script>
(function(){
const sections={
 calc:null,
 money:document.getElementById('moneySection'),
 finance:document.getElementById('financeSection')
};
document.querySelectorAll('[data-lc]').forEach(b=>{
 b.onclick=()=>{
  Object.values(sections).forEach(s=>{if(s)s.classList.remove('active')});
  if(sections[b.dataset.lc]) sections[b.dataset.lc].classList.add('active');
 };
});

const list=document.getElementById('lcList');
const add=document.getElementById('lcAdd');
let items=JSON.parse(localStorage.getItem('lc72_items')||'[]');
function render(){
 list.innerHTML=items.length?items.map(x=>x.name+' $'+x.amount).join('<br>'):'No items yet';
}
if(add) add.onclick=()=>{
 let name=document.getElementById('lcItem').value||'Expense';
 let amount=parseFloat(document.getElementById('lcAmount').value)||0;
 items.push({name,amount});
 localStorage.setItem('lc72_items',JSON.stringify(items));
 render();
};
render();

const calc=document.getElementById('loanCalc');
if(calc) calc.onclick=()=>{
 let p=parseFloat(document.getElementById('loanAmount').value)||0;
 let r=(parseFloat(document.getElementById('loanRate').value)||0)/100/12;
 let n=(parseFloat(document.getElementById('loanYears').value)||0)*12;
 let m=r? p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):p/n;
 document.getElementById('loanResult').innerHTML='Monthly: $'+m.toFixed(2);
};
})();
</script>
