<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>LifeCalc</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEFEFE"/>
      <stop offset="1" stop-color="#DCDFE5"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F2F5"/>
      <stop offset="1" stop-color="#C9CED7"/>
    </linearGradient>
    <linearGradient id="equals" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC2FD"/>
      <stop offset="1" stop-color="#2275EF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2C3445" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="197" y="197" width="290" height="290" rx="82" fill="url(#key)"/>
    <rect x="537" y="197" width="290" height="290" rx="82" fill="url(#key)"/>
    <rect x="197" y="537" width="290" height="290" rx="82" fill="url(#key)"/>
    <rect x="537" y="537" width="290" height="290" rx="82" fill="url(#equals)" stroke="#6DB9FB" stroke-width="3"/>
  </g>
  <!-- Glossy top highlight on each key -->
  <g fill="#FFFFFF">
    <rect x="200" y="200" width="284" height="130" rx="78" opacity=".72"/>
    <rect x="540" y="200" width="284" height="130" rx="78" opacity=".72"/>
    <rect x="200" y="540" width="284" height="130" rx="78" opacity=".72"/>
    <rect x="540" y="540" width="284" height="130" rx="78" opacity=".2"/>
  </g>
  <!-- Glyphs: + − × = -->
  <g stroke="#2C3445" stroke-width="48" stroke-linecap="round" fill="none">
    <path d="M306 342h72M342 306v72"/>
    <path d="M646 342h72"/>
    <path d="M317 657l50 50M367 657l-50 50"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="622" y="622" width="120" height="44" rx="22"/>
    <rect x="622" y="698" width="120" height="44" rx="22"/>
  </g>
</svg>
